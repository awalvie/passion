# Production config — deployed automatically by the GitHub Actions workflow.
# The __JWT_SECRET__ placeholder is replaced with the DEPLOY_JWT_SECRET GitHub secret at deploy time.
# Do NOT put real secrets in this file.

Server:
  Addr: ":3000"
  DBPath: "/opt/passion/passion.db"
  Seed: false

Auth:
  JWTSecret: "__JWT_SECRET__"
  JWTTTLHours: 720
  DevAuthBypass: false

YAMLImport:
  # Off deliberately, and temporarily. OwnerID below is now correct, but user 4's catalog
  # rows have no slugs yet, so an import would match nothing, create a second copy of
  # everything and prune the originals. ImportYAML refuses that outright, and with
  # Restart=on-failure a refusal at boot crash-loops the service — so the import is
  # switched off instead, leaving the site up.
  #
  # This is the only line to change. Flip it once docs/RECOVERY.md steps 3 and 4 are done:
  # the ghost rows removed, and --backfill-slugs run and checked against the YAML.
  Enabled: false
  ExercisesDir:
    - "/opt/passion/catalog/exercises"
    - "/opt/passion/catalog-private/exercises"
  SessionTemplatesDir:
    - "/opt/passion/catalog/session_templates"
    - "/opt/passion/catalog-private/session_templates"
  ActivityTemplatesDir:
    - "/opt/passion/catalog/activity_templates"
    - "/opt/passion/catalog-private/activity_templates"
  OwnerID: 4
