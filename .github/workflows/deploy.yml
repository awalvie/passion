name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-passion
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/awalvie/passion:${{ github.sha }}
      SSH: ssh -i /tmp/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v5

      # The licensed part of the catalog lives in a private repo, because it is
      # not ours to redistribute.
      - uses: actions/checkout@v5
        with:
          repository: awalvie/passion-private-catalog
          ssh-key: ${{ secrets.PRIVATE_CATALOG_DEPLOY_KEY }}
          path: deploy/catalog-private

      - name: Build and push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Write the server config
        env:
          CATALOG_OWNER: ${{ vars.CATALOG_OWNER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$CATALOG_OWNER" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::Set the CATALOG_OWNER variable and the POSTGRES_PASSWORD secret."
            exit 1
          fi
          # The password goes into DATABASE_URL and through compose's .env.
          case "$POSTGRES_PASSWORD" in *[!A-Za-z0-9._~-]*)
            echo "::error::POSTGRES_PASSWORD must hold only letters, digits and . _ ~ -"
            exit 1
          esac
          printf 'catalog:\n  private:\n    - location: /catalog-private\n      owner: ["%s"]\n' "$CATALOG_OWNER" > deploy/passion.yaml
          printf 'TAG=%s\nPOSTGRES_PASSWORD=%s\n' "${{ github.sha }}" "$POSTGRES_PASSWORD" > deploy/.env
          chmod 600 deploy/.env

      - name: Install SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Unpack into a staging directory, so a broken stream leaves the running
      # deploy as it was. Replacing the catalog wholesale drops files that git
      # moved or deleted. The server runs as another user, so it needs the
      # modes from the tar, not the host's umask.
      - name: Copy the deploy files
        run: |
          tar czf - --exclude='.git' -C deploy compose.yaml .env passion.yaml catalog-private | \
            $SSH "rm -rf /srv/passion/.stage /srv/passion/.old && \
                  mkdir -p /srv/passion/.stage /srv/passion/.old && \
                  tar xzpf - -C /srv/passion/.stage && \
                  cd /srv/passion && \
                  for f in compose.yaml .env passion.yaml catalog-private; do \
                    if [ -e \$f ]; then mv \$f .old/; fi; \
                  done && \
                  mv .stage/compose.yaml .stage/.env .stage/passion.yaml .stage/catalog-private . && \
                  rm -rf .stage .old"

      # A throwaway docker config keeps the short-lived token out of the
      # host's own login.
      - name: Start the new image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            $SSH "export DOCKER_CONFIG=\$(mktemp -d) && \
                  docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
                  cd /srv/passion && \
                  docker compose pull app; pulled=\$?; rm -rf \"\$DOCKER_CONFIG\"; unset DOCKER_CONFIG; \
                  [ \$pulled -eq 0 ] && docker compose up -d --wait --wait-timeout 120"
