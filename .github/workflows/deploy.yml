name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-passion

    steps:
      - uses: actions/checkout@v4

      # The licensed part of the catalog lives in a private repo, because it is not
      # ours to redistribute. It is checked out read-only with a deploy key and shipped
      # to the server alongside the published tree. Without it the server would import
      # a published-only catalog, and pruneCatalogOrphans would then delete every
      # session and block that depends on the licensed content.
      - uses: actions/checkout@v4
        with:
          repository: awalvie/passion-private-catalog
          ssh-key: ${{ secrets.PRIVATE_CATALOG_DEPLOY_KEY }}
          path: catalog-private

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o passion ./cmd/passion

      - name: Install SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy binary and assets
        env:
          JWT_SECRET: ${{ secrets.DEPLOY_JWT_SECRET }}
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "::error::DEPLOY_JWT_SECRET is not set. Add it to repository secrets."
            exit 1
          fi

          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=no"

          # Inject the JWT secret into the config template (plain string replace, safe for any secret chars).
          python3 -c "import sys; c=open('passion.prod.yaml').read(); open('passion.rendered.yaml','w').write(c.replace('__JWT_SECRET__',sys.argv[1]))" "${JWT_SECRET}"

          $SSH "mkdir -p /opt/passion"
          $SCP passion                                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/passion/passion.new
          $SCP passion.rendered.yaml                 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/passion/passion.yaml
          # Asset trees go over as a tar stream rather than scp -r, for two reasons:
          # scp never deletes, so a file renamed or moved in git lingered on the server
          # forever — for the catalog that is fatal, since the stale and current copies
          # declare the same exercise name and the importer rejects the duplicate; and
          # modern scp (SFTP-backed) will not create nested destination directories, so
          # subfolders under catalog/exercises fail to upload at all. Replacing each
          # directory wholesale keeps the server an exact mirror of the repo.
          # catalog-private carries the licensed content from the private repo. It is
          # replaced wholesale for the same reason as catalog: a file that moves between
          # the two trees would otherwise exist in both, and the importer rejects the
          # duplicate name.
          # Unpack into a staging directory first and swap only once that succeeds. The
          # obvious form — rm -rf on the server, piped straight into tar — deletes
          # before it knows the stream is any good, so a local tar that fails to start
          # leaves the server with no catalog, no templates and no static assets, and
          # the service dies on its next restart. Ask how this comment came to exist.
          #
          # Note the option order: czf must lead, or tar reads it as a file name.
          tar czf - --exclude='.git' catalog catalog-private templates static | \
            $SSH "rm -rf /opt/passion/.stage && mkdir -p /opt/passion/.stage && \
                  tar xzf - -C /opt/passion/.stage && \
                  rm -rf /opt/passion/catalog /opt/passion/catalog-private \
                         /opt/passion/templates /opt/passion/static && \
                  mv /opt/passion/.stage/catalog /opt/passion/.stage/catalog-private \
                     /opt/passion/.stage/templates /opt/passion/.stage/static \
                     /opt/passion/ && \
                  rmdir /opt/passion/.stage"

          printf '[Unit]\nDescription=Passion training app\nAfter=network.target\n\n[Service]\nExecStart=/opt/passion/passion -config /opt/passion/passion.yaml\nWorkingDirectory=/opt/passion\nRestart=on-failure\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' > passion.service
          $SCP passion.service ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/passion/

      - name: Swap binary and restart
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mv /opt/passion/passion.new /opt/passion/passion && \
             sudo mv /opt/passion/passion.service /etc/systemd/system/passion.service && \
             sudo systemctl daemon-reload && \
             sudo systemctl enable passion && \
             sudo systemctl restart passion"
