name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Start postgres
        run: nix develop -c make db-up

      - name: Check formatting
        run: nix develop -c sh -c 'test -z "$(gofmt -l server)"'

      - name: Vet
        run: nix develop -c go vet ./...

      # The spec is generated from annotations, so a handler change without a
      # regenerate leaves the docs describing an API that no longer exists.
      - name: Check the openapi spec is current
        run: |
          nix develop -c make openapi
          git diff --exit-code server/api/swagger.json

      - name: Test
        run: nix develop -c make test
