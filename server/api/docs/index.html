<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passion API</title>
  </head>
  <body>
    <div id="app"></div>

    <script src="scalar.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/api/openapi.json',

        // Scalar fetches Inter and JetBrains Mono from fonts.scalar.com by
        // default. An install with no internet must not depend on that.
        withDefaultFonts: false,

        // Agent is an AI chat panel that is on by default on localhost, and it
        // uploads the OpenAPI document to Scalar on the first message.
        agent: { disabled: true },

        // The default offers json and yaml behind a dropdown. We only publish
        // json, and the dropdown renders a stray white edge.
        documentDownloadType: 'json',

        telemetry: false,
      })

      // No proxyUrl: the docs and the API are the same origin, so requests go
      // straight to the server and need no CORS handling.
    </script>
  </body>
</html>
