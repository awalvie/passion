# Merged into the generated spec by `make openapi`. It holds what the route
# annotations cannot express — go-swagger has no annotation for tag
# descriptions.
swagger: "2.0"
tags:
  - name: accounts
    description: >-
      Creating an account and reading the one you are signed in as. An account
      owns everything else: sessions, records and any catalog items you edit.
  - name: tokens
    description: >-
      Signing in and out. Each sign-in mints one token for one device, so a
      phone and a laptop hold different ones and signing out of either leaves
      the other working. A token lasts thirty days, unless the server sets
      another length, and slides forward on use.
  - name: exercises
    description: >-
      Your library: the exercises the app ships and the ones you wrote. You can
      change and retire only your own. A retired exercise leaves the library but
      still reads by id.
  - name: session-templates
    description: >-
      Sessions to run: named sections of exercises, and choices such as "pick 1
      of these 3". The app ships some, and you can change and retire only your
      own. Each step keeps its own copy of the exercise's numbers.
  - name: runs
    description: >-
      Sessions as you did them. A run copies its template when it starts, so a
      later edit to the template never reaches it. An unfinished run counts for
      nothing, and a finished one can still be changed.
  - name: cycles
    description: >-
      A plan that repeats a block of days from one date to another, and places
      its sessions on the days they fall. Deleting a cycle keeps every run done
      under it.
  - name: centres
    description: >-
      The places you climb or train, and the sessions you can do at each.
  - name: scheduled-sessions
    description: >-
      Your calendar: one row per session per day, placed by a cycle or by you.
      A future one follows its template until you start it.
  - name: grades
    description: >-
      The scales a climb's grade is logged in, the same list the server checks
      against.
  - name: health
    description: Whether the server and its database are answering.
