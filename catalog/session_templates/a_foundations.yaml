name: "Foundations"
color: "#5d86c9"
label: "technique, footwork, balance"
activities:
  - type: "warmup"
    exercises:
      - ref: "General Warmup"
      - ref: "Heavy Feet"
        sets: 3
        reps: 1
        rep_seconds: 120
        set_rest_seconds: 60
  - type: "activity"
    exercises:
      - ref: "Silent Feet"
      - ref: "One-Touch"
      - ref: "Hover Hands"
  - type: "cooldown"
    exercises:
      - name: "Apply: Mantra Routes"
        kind: "climbing"
        notes: |
          Climb 2-3 routes ONE grade harder than drill terrain.
          Mantra on loop: "precise feet, straight arms, relaxed grip"
          Accept imperfect form — the point is to try.
  - ref: "Journal"
