name: "A: Foundations (Feet + Grip + Balance)"
color: "#3b82f6"
activities:
  - type: "warmup"
    exercises:
      - ref: "General Warmup"
      - ref: "Heavy Feet"
        sets: 3
        reps: 1
        rep_seconds: 120
        set_rest_seconds: 60
  - type: "activity"
    exercises:
      - ref: "Silent Feet"
      - ref: "One-Touch"
      - ref: "Hover Hands"
  - type: "cooldown"
    exercises:
      - name: "Apply: Mantra Routes"
        sets: 3
        reps: 1
        rep_seconds: 180
        set_rest_seconds: 90
        notes: |
          Climb 2-3 routes ONE grade harder than drill terrain.
          Mantra on loop: "precise feet, straight arms, relaxed grip"
          Accept imperfect form — the point is to try.
      - name: "Journal"
        sets: 1
        reps: 1
        rep_seconds: 180
        set_rest_seconds: 0
        notes: |
          Where did feet get loud?
          When did I regrip?
          Could I hold the 3-sec hover or did I collapse?
