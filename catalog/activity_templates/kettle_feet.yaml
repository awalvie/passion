name: "Kettle: Feet"
source: "John Kettle"
label: "footwork, technique, balance"
exercises:
  - name: "Feet Drill"
    kind: "exercise_catalog"
    notes: |
      Pick ONE footwork drill per session and hold its constraint across an easy-to-moderate boulder ladder. Work the base drills first; the combos lower down stack several constraints at once, so save them until each one feels natural on its own.
