      - ref: "Platform Builder"
      - ref: "Straight Arm, Bendy Body"
      - ref: "Hip and Hand"
      - ref: "The Leg Spring"
      - ref: "The Can-Can"
      - ref: "The Button"
      - ref: "The Big Three"
      - ref: "Button and Can-Can"
      - ref: "Can-Can and Hip and Hand"
      - ref: "The Inside-Outside Can-Can"
      - ref: "Final Exam I"
      - ref: "Final Exam II"
