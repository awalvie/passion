exercises:
  - name: "Movement Practice: Lead"
    kind: "exercise_catalog"
    notes: |
      One drill per session, in the warm-up ladder. Never at the end — tired
      practice degrades learning.

      Pick whichever fits the day. Lead days: breathing, committing, staying relaxed above the bolt.
      Well below limit.
