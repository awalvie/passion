name: "Fascia Warm-Up"
label: "warmup, mobility"
exercises:
  - name: "Standing Trunk Rotations"
    kind: "reps_and_sets"
    sets: 1
    reps: 10
    notes: |
      Feet at pelvis width, slightly turned out. Arms extended forward, soft elbows and knees.
      Rotate the whole body (including head) side to side. Feet stay glued to the ground.
      Semi-dynamic pace — faster than synovial exercises but still controlled. Stay relaxed.
      Variation: head and pelvis stay still, only trunk rotates.
  - name: "Side Bends (Chest Opener)"
    kind: "reps_and_sets"
    sets: 1
    reps: 10
    notes: |
      Hands connected above head, elbows wide.
      Bend sideways, keeping chest open.
      Variation: at the bottom, rotate the whole body to stretch the breast fascia.
      Focus on keeping elbows wide — don't collapse inward.
  - name: "Knee Dip Rotations"
    kind: "reps_and_sets"
    sets: 2
    reps: 5
    notes: |
      Similar to the synovial leg swing but with a knee dip.
      Semi-dynamic pace — go down with the knee and up. One set per leg.
  - name: "Inner Rotation Reach-Downs"
    kind: "reps_and_sets"
    sets: 1
    reps: 5
    notes: |
      Feet in inner rotation (pigeon-toed), soft knees.
      Rotate maximally to one side, then reach down touching the back of the leg.
      Maintain maximum rotation throughout the descent.
      Feet stay glued to the ground. Alternate sides.
      Feel it in the spine fascia. Use a chair if you can't reach the ground.
  - name: "Deep Squat Rotations"
    kind: "reps_and_sets"
    sets: 2
    reps: 5
    notes: |
      Get into a deep squat position.
      Reach one arm as high and far back as possible, thumb going backwards.
      Keep knees stable — don't let them cave in.
      Focus on maximum spinal rotation and arm reach. One set per arm.
