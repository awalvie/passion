name: "Kettle: Move Reading"
source: "John Kettle"
label: "tactics, route"
exercises:
  - name: "Move Reading Drill"
    kind: "exercise_catalog"
    notes: |
      Pick ONE move-reading drill per session and apply it to an unfamiliar route. These train the planning and reading side of climbing — read before you pull on, then check your plan against what actually happened.
    children:
      - ref: "Chunking"
      - ref: "Highlights"
      - ref: "Speed Chunking"
      - ref: "Micro Goals"
