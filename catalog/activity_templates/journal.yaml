name: "Journal"
label: "cooldown, tactics"
exercises:
  - name: "Journal"
    kind: "reps_and_sets"
    sets: 1
    reps: 1
    rep_seconds: 180
    set_rest_seconds: 0
    notes: |
      Reflect on the session while it's fresh:
      - What broke down first — feet, grip, breathing, or commitment?
      - Where did I hesitate, regrip, or lose the intended focus?
      - Which moves matched my plan, and which surprised me?
