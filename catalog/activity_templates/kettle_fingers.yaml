name: "Kettle: Fingers"
source: "John Kettle"
label: "fingers, technique"
exercises:
  - name: "Fingers Drill"
    kind: "exercise_catalog"
    notes: |
      Pick ONE finger drill per session and hold its constraint across an easy-to-moderate boulder ladder. Both teach how you grip and place — keep the terrain well within your limit so the focus stays on quality, not strength.
    children:
      - ref: "The Sloth"
      - ref: "Finger Ninja"
