name: "Movement Practice: Endurance"
label: "technique, warmup, endurance"
exercises:
  - name: "Movement Practice: Endurance"
    kind: "exercise_catalog"
    notes: |
      One drill per session, in the warm-up ladder. Never at the end — tired
      practice degrades learning.

      Pick whichever fits the day. Endurance days: pace, grip economy, staying loose.
      Well below limit.
    children:
      - ref: "Eyes, Feet, Hips, Hands"
      - ref: "Soft Hands"
      - ref: "Silent Feet"
      - ref: "Straight Arms + Relaxed Grip"
      - ref: "Grip Tipping Point"
      - ref: "Fluid Style"
      - ref: "Increase Pace"
      - ref: "Matched Breath"
