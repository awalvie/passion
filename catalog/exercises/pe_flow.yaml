name: "PE Flow"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=8X8BbVjrZ7g"
    thumbnail_url: "https://i.ytimg.com/vi/8X8BbVjrZ7g/maxresdefault.jpg"
notes: |
  Boulders should start out steep and become progressively less overhung and less taxing on the fingers. Ideally, the last boulder should be on a slab or flat wall.

  Pick 4 boulders descending in difficulty. All boulders should challenge your movement and require attention to technical execution. Boulders should be 8–14 moves long and sustained in difficulty.

  Boulder #1: 8/10 RPE
  Boulder #2: 7/10 RPE
  Boulder #3: 6/10 RPE
  Boulder #4: 5/10 RPE

  Week 1: 1–2 boulders
  Week 2: 1–3 boulders
  Week 3: 2–3 boulders
  Week 4: 2–4 boulders
  Week 5: 1–2 boulders
  Weeks 6–9: 2–4 boulders

  Set a 6-minute timer and see how many times you can complete the boulder. Take as little rest as needed to cleanly send the boulder as many times as possible. This may take strategy!

  Your recovery time will improve week to week as you learn the boulders and find their efficiencies.

  Focus on perfecting your sequence — make each move as effective and efficient as possible. Use your breath to set your pace and move quickly while maintaining control.

  Rest 6–10 minutes between boulders.

  Record how many laps you complete and try to beat your count each week!

  This is a highly fatiguing drill. Do not continue if movement quality dips or you feel you won't fully recover before your next session. It is always better to do too little than too much — even 1 boulder is a great workout.
