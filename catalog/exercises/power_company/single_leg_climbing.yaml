name: "Single-Leg Climbing"
source: "Power Company Climbing"
label: "balance, footwork, boulder"
kind: "session"
session_duration_seconds: 480
notes: |
  Climb easy problems using only your left foot (2 sets),
  then only your right foot (2 sets).

  The missing foot destroys your balance, which forces you to
  move your hips over the standing foot and flag the free leg
  as a counterweight. Makes flagging instinctive.
  Source: Power Company, Self-Coached Climber
