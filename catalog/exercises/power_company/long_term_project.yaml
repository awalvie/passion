notes: |
  Work a long-term project that may or may not ever get done, but forces you to try really hard because there's still a possibility you might do it.

  Boards are great for these mega projects.

  The important thing is that you constantly and honestly reassess and adjust your beliefs about what's possible. Really hard climbing depends on that belief.

  Apply the **seven try rule**: give 7 honest efforts. If you make any progress — even just creating a little movement from a position you could barely hold — keep going. If you make zero progress in 7 tries, move on for now and revisit later to gauge improvement.
