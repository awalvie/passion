name: "Perfect Repeats"
source: "Power Company Climbing"
label: "technique, endurance, boulder"
kind: "session"
notes: |
  Pick 2 problems at flash level. Climb each 3-5 times, tweaking
  micro-beta each lap until the movement is absolutely smooth.

  Lap 1: figure it out. Lap 2: clean up. By lap 5: choreography.
  Rhythm comes from knowing the moves so well that the gaps
  between them disappear.
  Source: Power Company Climbing
