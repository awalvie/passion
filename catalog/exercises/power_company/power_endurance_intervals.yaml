notes: |
  Middle-intensity endurance work. You've crossed the anaerobic threshold — the pump is growing and the race is on.

  **Classic format: 4x4** — four sets of four back-to-back boulders with rest between sets. But don't stick rigidly to this. Adjust intervals to fit your goals:

  - **Boulderers:** Several sets of 2 difficult boulders back-to-back (or with brief rest between the two).
  - **Sport climbers:** Sets of 5 easy-to-moderate boulders followed by 1 difficult boulder.

  **On a rope — Crux Intervals:** Find a route that starts with moderately difficult first few bolts but eases off for the top. Lead up the hard section, say "take" and lower back to the ground. Top-rope back to the highest clip, lower off, and repeat. Build a sufficient pump, then continue up the remainder of the route.

  Unlike low-intensity endurance, these sessions are **very taxing** and raise recovery time dramatically. This type of endurance climbing is absolutely skillful — you have to learn how to be efficient, how much you can get back at a rest, and how to believe you can keep going when it feels like you can't.

  You can spin up this type of endurance with just a handful of sessions close to performance time, especially if you've developed the skills previously.
