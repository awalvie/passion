notes: |
  Choose one of these formats to practice sending under pressure:

  **Three-Strike Boulders:** Pick something new or something really hard you'd like to repeat. You get exactly 3 attempts — send or not, ask yourself why.

  **10-Minute Takedown:** Choose a hard boulder and try to learn enough in 10 minutes to give it 1–2 high-quality send attempts. Then send or not, ask yourself why.

  This kind of pressure rewards you for trying harder instead of just ironing things out over unlimited attempts. Great practice before a climbing trip.
