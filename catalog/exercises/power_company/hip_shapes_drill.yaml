name: "Hip Shapes"
source: "Power Company Climbing"
label: "technique, tension, footwork"
kind: "session"
media:
  - video_url: "https://www.youtube.com/watch?v=asUzUdeX1UE"
    thumbnail_url: "https://i.ytimg.com/vi/asUzUdeX1UE/hqdefault.jpg"
notes: |
  Pick one easy boulder. Climb it twice per set:
  - Lap 1: every move TWISTING (hip to wall, backstep/drop-knee)
  - Lap 2: every move SQUARE (hips parallel, frog-like)

  Neither will feel right for every move — that's the point.
  You learn through the contrast which shape works where.
  Source: Power Company / Kris Hampton

  On every move, consciously move your hips into the best possible position before reaching for the next hold.

  Before each hand move, ask: where should my hips be? In toward the wall? Over the high foot? Open or closed? Then move your hips there first — and hold that position as you reach.

  Most climbers move their arms and drag their hips along afterward. This drill reverses the order. Hips lead; arms follow. The result is less arm strain, better reach, and more efficient use of your legs.

  Work on easy-to-moderate terrain to give yourself room to think and feel. Slow down. Make every hip transition intentional.
