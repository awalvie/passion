name: "Iron Monkey"
source: "Power Company Climbing"
label: "tension, power, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=nYA5xie-bNk"
    thumbnail_url: "https://i.ytimg.com/vi/nYA5xie-bNk/hqdefault.jpg"
notes: |
  Climb with maximum rigidity and tension throughout your entire body — every muscle switched on from feet to core to shoulders.

  Every foot placement is pressed actively into the wall. Every hand placement is gripped with intent. Your core is braced as if absorbing a punch. Your shoulders are engaged and locked. Nothing is passive.

  This drill builds the body tension habits that are essential on steep and overhung terrain, where loose, passive movement leads to barn-dooring, falling feet, and wasted energy.

  Use moderate overhung terrain where body tension has a direct and immediate effect on your ability to stay on the wall. Notice when and where you lose tension — those are your training targets.
