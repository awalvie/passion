name: "Hip Shapes"
source: "Power Company Climbing"
label: "technique, tension, footwork"
kind: "reps_and_sets"
sets: 2
reps: 2
rep_seconds: 180
set_rest_seconds: 120
notes: |
  Pick one easy boulder. Climb it twice per set:
  - Lap 1: every move TWISTING (hip to wall, backstep/drop-knee)
  - Lap 2: every move SQUARE (hips parallel, frog-like)

  Neither will feel right for every move — that's the point.
  You learn through the contrast which shape works where.
  Source: Power Company / Kris Hampton
