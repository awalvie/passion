notes: |
  Repeat a moderate boulder 5–10 times in a row with minimal rest, focusing on maintaining perfect technique as fatigue accumulates.

  The goal is not to rest until form breaks down — the goal is to maintain form despite the pump. Each rep should look and feel as clean as the first. When technique degrades, stop.

  This drill trains movement quality under endurance stress, which is the exact condition that separates climbers on long boulder problems and route cruxes. Fatigue-proof technique is built by practicing correct movement while fatigued.

  Choose a boulder that is technically sound but physically manageable — around 60–70% of max effort. Increase volume gradually across sessions.
