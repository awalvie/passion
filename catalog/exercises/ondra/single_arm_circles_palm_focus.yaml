name: "Single Arm Circles (Palm Focus)"
slug: "single_arm_circles_palm_focus"
label: "warmup, mobility"
kind: "reps_and_sets"
sets: 2
reps: 5
notes: |
  Right arm: lift with palm facing upward, rotate at the top, bring down with palm facing downward.
  Repeat in the other direction (upper palm facing upward, rotate, upper palm facing downward).
  Keep torso straight — avoid rotating the body. Repeat on left arm (1 set per arm).
