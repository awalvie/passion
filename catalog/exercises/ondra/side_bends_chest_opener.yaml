name: "Side Bends (Chest Opener)"
label: "warmup, mobility"
kind: "reps_and_sets"
sets: 1
reps: 10
notes: |
  Hands connected above head, elbows wide.
  Bend sideways, keeping chest open.
  Variation: at the bottom, rotate the whole body to stretch the breast fascia.
  Focus on keeping elbows wide — don't collapse inward.
