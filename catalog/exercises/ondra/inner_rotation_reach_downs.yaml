name: "Inner Rotation Reach-Downs"
slug: "inner_rotation_reach_downs"
label: "warmup, mobility"
kind: "reps_and_sets"
sets: 1
reps: 5
notes: |
  Feet in inner rotation (pigeon-toed), soft knees.
  Rotate maximally to one side, then reach down touching the back of the leg.
  Maintain maximum rotation throughout the descent.
  Feet stay glued to the ground. Alternate sides.
  Feel it in the spine fascia. Use a chair if you can't reach the ground.
