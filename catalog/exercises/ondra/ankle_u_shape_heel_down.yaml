name: "Ankle U-Shape (Heel Down)"
slug: "ankle_u_shape_heel_down"
label: "warmup, mobility"
kind: "reps_and_sets"
sets: 2
reps: 5
notes: |
  Stand on one foot, other foot's heel stays on the ground.
  Draw a U-shape with the foot: big toe side to pinky side.
  Keep the knee completely stable — only the ankle moves. One set per foot.
