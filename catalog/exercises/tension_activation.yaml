name: "Tension Activation"
kind: "session"
session_duration_seconds: 900
media:
  - video_url: "https://www.youtube.com/watch?v=-r_zYCUzh28"
    thumbnail_url: "https://i.ytimg.com/vi/-r_zYCUzh28/maxresdefault.jpg"
notes: |
  # Intent

  Develop precise foot tension, open-hip force application, and controlled reaching mechanics by learning to keep a single foothold engaged during long, tension-dependent reaches.

  # Watch First (Mandatory)

  **Watch the video before attempting this drill.**
  Your first objective is to **replicate the movement as closely as possible** to learn the *essence* of the concept before refining or scaling.

  # Set-Up

  - Use a **spray wall, board, or high-density wall**
  - Establish:
    - **1 poor or flat handhold** (lagging hand — remains on)
    - **1 good handhold** (reaching hand)
  - Choose **ONE foothold only**
    - Same side as the reaching hand
    - No second foot allowed

  # Body Position Requirements

  - **Open-hip position ONLY**
    - No twisting or closed-hip movement
  - Foothold must be:
    - **Outside shoulder width**
    - Between shoulder line and maximal leg reach without torso shift
  - Torso remains quiet and stacked
  - The **primary challenge is keeping the foot on**, not sticking the hand

  # Execution

  Select a **target hold ~2 to 3 feet above** your starting hands.

  Initial version should:
  - Be stickable with the hand
  - Cause the **foot to cut on the first attempt**

  Make the move smaller by starting with the reaching hand on a hold very close to the target, just underneath it and then progressively move this hand lower (making the move bigger).
  - Continue until you can **stick the original move without the foot cutting**

  Alternate attempts on:
  - The **mirror image**, or
  - A move of equal difficulty on the opposite side

  # Attempts

  - Continue until:
    - You successfully complete the **original move with feet on**, **OR**
    - You reach **10 total attempts** (both sides combined)
  - If unsuccessful:
    - **Return to the exact same move next session**

  # Rest

  - **30–60 seconds** between attempts
  - Fully recover between these single moves

  # RPE Target

  **6–7 / 10**

  - Should feel:
    - Challenging but controlled
    - Technically demanding, not explosive
  - If effort exceeds RPE 7, scale the move down

  # Coaching Cue

  Drive the loaded foot **downwards as hard as possible BEFORE** pulling outwards, away from the wall.

  Maintain an **active calf in plantar flexion**, a **tight hamstring**, and avoid letting the knee drift into extension. Keep the **core braced**, **lower back engaged**, and **glute locked in** to stabilize the pelvis. As you reach, push **downward hard enough** through the foothold to create friction that counteracts the outward pull of your body. The foot stays on because **downward force generates the friction needed to resist outward force**—lose the downward drive, and the foot will slide.
