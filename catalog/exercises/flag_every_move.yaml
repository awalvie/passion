name: "Flag Every Move"
slug: "flag_every_move"
label: "technique, balance, footwork"
kind: "climbing"
notes: |
  Never let the spare foot dangle. Every move, park it — behind the other leg,
  out to the side, or pressed flat on the wall.

  Cue: if you swing or the hip drops, the flag was in the wrong place.

  Easy terrain. Slow enough to pick the flag before you move.
