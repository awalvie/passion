name: "Power Company: Sloth Monkey"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=rYmiMqj4TqM"
    thumbnail_url: "https://i.ytimg.com/vi/rYmiMqj4TqM/hqdefault.jpg"
notes: |
  Climb as slowly as possible. Every move should be deliberate, controlled, and silent.

  Before placing a hand or foot, pause. Hold the position. Feel the tension in your body. Then move — but at a fraction of your normal pace. The goal is to remove all momentum from your climbing. Every gain must be earned through static strength and body tension, not speed or swing.

  This drill exposes every weakness in your movement. When you eliminate momentum, you can no longer hide poor technique behind dynamic flair. Sloppy hip positioning becomes immediately apparent. Inefficient foot placements force muscular compensation. Dead hangs that felt easy become loading exercises.

  Work ladders of easy-to-moderate boulders. The grade doesn't matter. The quality of movement is everything.

  Progress: once you can climb a problem sloth-slow with full control, try doing it with an exaggerated pause — 2–3 seconds — at every hand and foot placement.
