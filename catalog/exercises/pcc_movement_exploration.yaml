notes: |
  Get out of your comfort zone into the **learning zone** — a little awkward and bumbly, mentally taxing, but you can still try different things and be creative.

  **In a commercial gym**, go straight to the things you normally avoid: the steep cave, the techy vert walls, the comp-style boulders. These are low-hanging fruit — you stand to make the most progress here.

  **File away difficult moves** from your go-hard days. If a specific move felt oddly difficult for the grade, or you used your strengths to bypass a move, come back to it during explore sessions.

  **Think like a setter:**
  - On your spray wall or a board, make things up with friends who climb differently from you.
  - Use eliminates to create new challenges — remove key holds (including footholds).
  - Link existing climbs together to unlock completely new moves the setters didn't intend.
  - Adjust difficulty via **orientation and direction** (which way the hold faces, which direction you go), not just hold quality and distance.

  **Key principles:**
  - Don't fall into the trap of doing harder versions of what you're already good at.
  - Make up rules for the climb and stick to them, even when your intuition says to change.
  - Don't get trapped in the send cycle — move sends to a go-hard day.
  - Lean into moments that feel awkward and see if you can make the move feel better.
  - Even sessions where nothing clicks are wins — you're finding where you don't need to work.
