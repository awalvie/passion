name: "Eyes, Feet, Hips, Hands"
label: "technique, footwork, balance"
kind: "climbing"
notes: |
  Say it in order, every move: eyes, feet, hips, hands.

  Eyes on the hold before you move. Feet set. Hips over them.
  Hand last — the hold should arrive, not get hauled.

  Easy terrain, well below limit. Hand went first? Redo the move.
