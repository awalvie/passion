name: "Seated Hamstring Hold"
label: "cooldown, mobility"
kind: "timed_reps"
sets: 1
reps: 2
rep_seconds: 45
set_rest_seconds: 0
prep_seconds: 10
media:
  - video_url: "https://www.youtube.com/watch?v=_Ivm4C53zBQ"
    thumbnail_url: "https://i.ytimg.com/vi/_Ivm4C53zBQ/maxresdefault.jpg"
notes: |
  One leg straight, the other tucked in. Fold from the hips, chest toward
  the shin.

  A slight knee bend is fine — a long spine matters more than a straight
  leg. 45s each side.
