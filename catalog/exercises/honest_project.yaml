notes: |
  Choose a boulder to project exactly as you normally would, but approach it with an elevated level of **awareness, intentionality, and technical honesty.** Before your first attempt, spend extra time **deeply visualizing every single move** — not just seeing yourself climb it, but imagining the **tactile sensation** of each hold, the precise **angle of your foot placements**, and how each point of contact shifts your **center of mass**.

  Picture the moves unfolding with perfect execution: tension where you need it, relaxation where you don't, hips moving through space in the exact pathways that make the climb possible.

  RPE RANGE: The boulder you choose should have an RPE OR Complexity Rating of 10/10. Meaning, the climb should feel like it is the hardest thing you can possibly do at this time. This climb could be straight forward power with a high RPE and low complexity, or it could be a slab with low RPE and high complexity. What matters is that you get on a climb that is your greatest opportunity for growth and that moves you towards your goals.

  ## 🧠 Visualization = Technical Rehearsal

  As you mentally rehearse:

  - Feel the **texture of the holds** and how your fingers will orient on them.
  - Imagine the **direction of pull** you need for each move — up, down, sideways, in-and-down, diagonal compression.
  - Pay attention to the **hip pathway** for every movement: where it starts, how it transitions, and where it needs to end.
  - Visualize how your **breathing** should sync with the crux: inhale on the wind-up, exhale on the execution.
  - Picture your feet landing **quietly and precisely** — no shuffling, no panic adjustments.

  Only when your mental replay feels **smooth, confident, and fully mapped**, should you make your first attempt from the start.

  ## 🎯 Strategic Work = True Efficiency

  After that first attempt:

  - Don't fall into the trap of "try-from-the-bottom-every-time" projecting.
  - Save your energy for the sections that matter — the hardest moves or the linkages that repeatedly shut you down.
  - Break the climb into:
    - **Isolated moves**
    - **Micro-links (2–3 moves)**
    - **Mid-links (4–6 moves)**
    - **Full links** only when warranted

  It's totally fine — even preferred — to climb into the crux using **easier holds** if it conserves power and improves your chance of learning the movement.
  This is efficiency. This is honesty.

  ## 🧩 Crux Refinement = Skill Adaptation

  As you work the crux:

  - Study the **exact foot angle** that gives the best purchase — toe in, toe out, dropped knee, rotated hip.
  - Notice how much **tension** is required — are you overgripping?
  - Experiment with **micro deadpoints** instead of static pulls.
  - Identify when your **breathing** can improve energy efficiency.
  - See what changes when you **lead with your hips** instead of your shoulders.

  Your job is to dial these moments in so precisely that they become **repeatable**. Repeatability is the real marker of readiness to send.

  ## 📈 Reflective Practice = Accelerated Learning

  When you make new links, hit new high points, or suddenly feel a move "unlock":

  - Pause.
  - Ask yourself exactly *what changed*.
  - Write it down or say it out loud if needed.

  Was it:

  - Better hip position?
  - Different finger angle on a hold?
  - More composure in the setup?
  - A refined foot sequence?
  - A deliberate breath?

  Absorb the lesson. This drill only works if you pay attention to those moments of progress.

  ## ⏱️ Rest Management = Self-Discipline

  As you link more moves together, understand that:

  - **The closer you get to a send, the longer your rests should be.**
  - Your goal is not more attempts — your goal is **the right attempts**.

  Set a timer and stick to it:

  - Don't rush because you're excited.
  - Don't cut rest short because you "feel good."
  - Don't let adrenaline override strategy.

  Being eager to send means being disciplined enough to rest for it.

  **Take a 1-minute rest per move executed on the wall.**

  ## 🔥 High-Quality Attempts Only

  For this drill, you get **six fully-focused, high-quality attempts**.

  Six. This includes attempts from the start and longer links. If you are simply trying 1 move in isolation, you can count that as ⅓ of an attempt.

  Every one of them should feel like a test of everything you've learned — movement, breath, tension, visualization, and composure.

  The intention here is to project with the **precision and honesty of a top-level climber** instead of mindlessly thrashing from the bottom over and over.

  ## 💥 Pick True Limit Projects

  Choose climbs that:

  - Sit at your absolute edge
  - Require near-perfect execution
  - Will take **2–4 sessions** to complete
  - Demand full-body tension, refined technique, and psychological sharpness

  Anything easier won't reveal your weaknesses or push your growth. Anything harder won't let you apply the drill effectively.

  This is meant to sharpen your projecting skill at the highest level — to teach you how to break down a boulder, solve it piece by piece, and send it with intention and mastery.
