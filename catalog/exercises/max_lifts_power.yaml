name: "Max Lifts (power)"
kind: "session"
session_duration_seconds: 1800
media:
  - video_url: "https://www.youtube.com/watch?v=JTkuzCx51eA"
    thumbnail_url: "https://i.ytimg.com/vi/JTkuzCx51eA/maxresdefault.jpg"
notes: |
  Using a 20–30mm edge (Tension Block or any portable hangboard), perform lifts off of the ground for the prescribed amount of reps at 80% of your 1RM.

  Perform warm-up sets of:
  - 8 reps at 40%, 50% 1RM
  - 6 reps at 60%, 70% 1RM

  Then perform working sets.

  A lift is simply lifting the weight off of the ground for a full second. Try to lift the block quickly off the ground, but not explosively.

  You can also do the same thing by holding an edge on the hangboard with the same amount of added/removed weight and picking your feet up by pulling up off the ground for 1-second intervals.

  If you choose to lift off the ground, make sure to lift only with your legs, keeping perfect squatting form.

  You should finish this workout and feel like your fingers still have a lot of juice in them! The body responds the same way to an 80% load as it does to a 100% load in terms of adaptation, so we want to go with the lowest amount of fatigue possible.

  Rest 3 minutes between sets.

  Weeks 1–2: 2 sets × 4 reps
  Weeks 3–4: 3 sets × 4 reps
  Week 5: 2 sets × 3 reps
  Weeks 6–7: 4 sets × 4 reps
  Weeks 8–9: 5 sets × 4 reps
