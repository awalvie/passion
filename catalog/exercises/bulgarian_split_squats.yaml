name: "Bulgarian Split Squats"
kind: "reps_and_sets"
sets: 1
reps: 6
rep_seconds: 6
media:
  - video_url: "https://www.youtube.com/watch?v=1-GzXim_jtw"
    thumbnail_url: "https://i.ytimg.com/vi/1-GzXim_jtw/maxresdefault.jpg"
notes: |
  6 reps per side. Use 85% of 1RM. Tempo: 3–1–1–1 (3s descent, 1s pause at bottom, 1s ascent, 1s reset at top).

  Complete ALL reps on the left leg first, then ALL reps on the right. Do NOT alternate sides between reps.

  **Setup**

  - Stand a short stride length in front of a bench or box.
  - Place the top of the rear foot on the bench (laces down or toes tucked).
  - Front foot planted firmly, pressure through mid-foot and heel.
  - Ribcage stacked over pelvis, chest tall, hips square.

  **Descent**

  - Lower straight down by bending the front knee and hip.
  - Rear knee drops toward the floor, front knee tracks naturally over the toes.
  - Sit between your legs — not forward, not back.

  **Bottom Position**

  - Front thigh approaches parallel (or controlled max depth), heel stays planted, pelvis level.

  **Ascent**

  - Drive through the front heel and mid-foot to full hip and knee extension.
  - Maintain upright posture. 1-second reset at the top before the next rep.

  **Common Mistakes**

  - Alternating legs every rep
  - Front heel lifting
  - Overloading the rear leg
  - Knee collapsing inward
  - Excessive forward torso lean
  - Rushing tempo
