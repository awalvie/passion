notes: |
  Campus board or steep overhang climbing with no feet — focusing on explosive contact strength and lat engagement.

  Move dynamically between rungs or holds, catching each contact at peak upward momentum. Drive from the lats and shoulders — not the biceps. The movement should feel like a pull and a push simultaneously: one arm pulls while the other extends and reaches.

  Start with basic laddering (1-2-3) before adding skips (1-3-5). Rest fully between sets — this is maximum power training, not endurance. Tired campus movement builds bad habits and increases injury risk.

  Prerequisites: a healthy finger and shoulder foundation. Do not attempt if fingers or elbows are tender.
