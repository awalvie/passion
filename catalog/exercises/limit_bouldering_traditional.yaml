name: "Limit Bouldering (Traditional)"
kind: "session"
session_duration_seconds: 1800
media:
  - video_url: "https://www.youtube.com/watch?v=jN5O4vo-C5Y"
    thumbnail_url: "https://i.ytimg.com/vi/jN5O4vo-C5Y/maxresdefault.jpg"
notes: |
  1 boulder per session on a systems board (Tension, Moon, Kilter, Grasshopper, etc.)

  **MAXIMAL FINGER AND FULL BODY POWER FOCUS!**

  Work project-level (2–4 sessions) boulders that are all about finger strength on bad holds. These boulders should challenge both your finger's maximal strength and power.

  **STOP BOARD CLIMBING THE INSTANT YOU FEEL YOUR MAXIMAL STRENGTH AND POWER DIP FROM 100%!**

  6 attempts per boulder.

  You will be limited to a total of 6 attempts for this drill. Use them wisely. Boulders should take you between 3 to 20 attempts to send (1 or multiple sessions).

  By "ATTEMPTS" I mean when you link a few moves together. Do not count a single move as an attempt; however, they add up in terms of volume and effort, so count 3 single-move tries as an attempt.

  The goal of this session is to — every time you step on the wall — try as hard as you possibly can on the hardest moves your body is capable of. These moves should be dynamic and powerful and on holds that are hard to hold for you.

  Between 3 and 6 moves in length.

  Receive 1 minute of rest per move executed on the wall.
