name: "Heel-Hook Isometric Pull 60, 90, 120 Degrees"
source: "Paradigm Climbing"
label: "strength, tension, footwork"
kind: "timed_reps"
sets: 6
reps: 1
rep_seconds: 30
set_rest_seconds: 120
media:
  - video_url: "https://www.youtube.com/watch?v=12e6VfaYYoo"
    thumbnail_url: "https://i.ytimg.com/vi/12e6VfaYYoo/maxresdefault.jpg"
  - video_url: "https://www.youtube.com/watch?v=AweS4K8UeQg"
    thumbnail_url: "https://i.ytimg.com/vi/AweS4K8UeQg/maxresdefault.jpg"
notes: |
  6 sets total — 1 hold at each angle (60°, 90°, 120°) per leg. Effort: 90% of max.

  The angles refer to the knee joint. Pull down with the top leg and push up into the bottom of the bench with the bottom leg so that your back stays on the ground and the only muscle flexing is your hamstring. You may also point your foot in dorsiflexion to engage the calf.
