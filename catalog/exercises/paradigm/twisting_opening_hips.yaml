notes: |
  Run a standard boulder ladder — but climb each problem twice with two completely different movement intentions.

  On the first ascent, commit to **open-hip positioning** on every move. Turn one — or when possible both — knees outward. Prioritize using the **inside edge** of your shoe. Keep the ankle active, drive through the leg, and establish a strong, balanced position directly over the foothold. Think tall posture, open pelvis, and clean force transfer through the foot.

  On the second ascent, switch to **closed-hip mechanics** — deliberate drop-knees and inward rotation. Turn the knee and hip toward the wall on each move. Use your **toe or outer edge**, lean slightly back into the handhold, and press your hips flat to the wall. Let your center of mass shift over or even slightly behind the foothold as you twist.

  Same boulder. Two different mechanical solutions.

  The goal isn't just sending — it's expanding your movement vocabulary and learning how hip orientation changes force application, balance, and efficiency.
