name: "One-Arm Lock-Off 90°"
source: "Paradigm Climbing"
label: "strength, tension"
kind: "timed_reps"
sets: 2
reps: 1
rep_seconds: 10
set_rest_seconds: 300
prep_seconds: 10
media:
  - video_url: "https://www.youtube.com/watch?v=aDeEkQ0g5cA"
    thumbnail_url: "https://i.ytimg.com/vi/aDeEkQ0g5cA/maxresdefault.jpg"
notes: |
  If you can not do this with 1-Arm, use 2 Arms.

  Do this with an amount of resistance or assistance that allows you to keep the angle in your arm for around 14 seconds. Stop at 10 seconds. If you can hold a 2-Arm Lock-Off with 75% of your body-weight in added weight, then switch to doing 1-Arm Lock-Offs. If you can not do 12 seconds at Body-Weight, then use a resistance band and hold it in the other hand. Mark where you are holding it each session in order to track progress! A Pulley system works just as well!
