name: "Ideal Circuit (boulders)"
source: "Paradigm Climbing"
label: "technique, endurance, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=K30druQcvos"
    thumbnail_url: "https://i.ytimg.com/vi/K30druQcvos/maxresdefault.jpg"
notes: |
  Find 10 boulders that are the hardest 10 boulders you can do in a session before dipping below 90% Max Strength levels in your fingers.

  This drill is best done on the commercial set of your gym or outdoors, as VARIETY of terrain, style, hold types and movements is paramount.

  These boulders should ALL be focused on developing your weaknesses and improving your movement. Every boulder should be a true challenge at first. They should also ALL challenge your movement!

  Your goal here is to find the best possible training session for yourself that you can repeat every week and see noticeable improvements on these boulders that were once very difficult. Ideally, every time you run these boulders, they become easier and easier for you. It is through this repetition in the most ideal zone of the learning curve (challenging but repeatable) that we develop skills at the most rapid rate.

  Choose problems based on varying angles, hold types, movement styles, and length. Try to get as diverse a range of boulders as possible. Your focus is on the perfect execution of these boulders, with flawless technique and efficiency as your primary objectives.

  You should not fall more than a handful of times during this entire drill. If you fall due to fatigue or a lack of strength, the boulder(s) are too hard. You need to be able to finish all 10 every single session.

  Repeat the same circuit of boulders from week to week if you can to ensure that you are progressing. This will also be a great gauge of accumulated fatigue. If they are becoming easier, you are becoming stronger, more efficient, and recovering adequately. If they feel the same or harder, then we need to adjust your volume or the intensity of your training. However, if a climb is taken down and reset, don't panic, simply pick a new climb.

  STOP WHEN YOUR FINGERS FEEL LIKE THEY ARE DROPPING IN STRENGTH OR POWER. Continuing past this point will develop poor movement quality and increase injury risk.

  *RECORD THESE BOULDERS AND HOW YOU PERFORM EVERY SESSION IN YOUR JOURNAL!

  Rest for full recovery between boulders!
