notes: |
  Choose a couple of the exercises below to give these body parts a bit of priming prior to climbing. Do 2–3 sets of each exercise, gradually increasing the intensity with each set. Start with 5-second isometric contractions for 2–4 reps.

  **RPE target:** Start at ~5/10, increase to 8/10.

  *(RPE = Rate of Perceived Exertion where 10 is max effort.)*

  ## Compression, Heel Hook, and/or Sloper Sessions
  - Wrist Curls
  - Chest Flys
  - Heel-Hook Isometrics
  - Pushup Holds
  - Bicep Curls

  ## Board Sessions
  - Copenhagens and Toe-Pull Isometrics
  - SLRDL
  - Rows
  - Reverse Flys
  - Lock-Off at 90°, 120°, Full

  ## Gym Sets
  - Rows
  - Overhead Press
  - Push-up Hold
  - Heel Hook and/or Toe Pull Isometrics
  - Lock-Off at 90°, 120°, Full
