name: "Overhead Press"
slug: "overhead_press"
label: "antagonist, strength"
kind: "reps_and_sets"
sets: 3
reps: 6
set_rest_seconds: 90
media:
  - video_url: "https://www.youtube.com/watch?v=dh-R8cUoPfA"
    thumbnail_url: "https://i.ytimg.com/vi/dh-R8cUoPfA/maxresdefault.jpg"
notes: |
  Use 85% of 1RM. Can be performed with barbell or dumbbells.

  **Setup**

  - Stand tall with feet about hip-width apart.
  - Barbell starts at upper chest height (collarbones/front delts); dumbbells start at shoulder height.
  - Ribcage stacked over pelvis, glutes lightly squeezed, abs braced (no low-back arching).
  - Grip (barbell): hands just outside shoulder width, wrists stacked over elbows.
  - Grip (dumbbells): neutral or slightly pronated, elbows under wrists.

  **Press**

  - Inhale and brace, then press the weight upward smoothly.
  - As the bar rises, move your head slightly back to clear the path, then bring it back through as the bar passes forehead height.
  - Bar path: straight up, close to the face, stacking over shoulders and mid-foot.
  - No leaning back. No rib flare.

  **Lockout**

  - Arms fully extended overhead, biceps near ears, scapulae upwardly rotated, neck long and relaxed.
  - Bar or dumbbells stacked over shoulders, hips, and mid-foot.

  **Descent & Reset**

  - Lower under control back to the start. Re-brace before every rep.

  **Common Mistakes**

  - Excessive low-back arch ("lean-back press")
  - Ribs flaring up
  - Pressing the bar forward away from the body
  - Shrugging aggressively at lockout
  - Losing tension between reps

  If you can't keep ribs stacked, the weight is too heavy.
