name: "Sub Limit for Guaranteed Improvement"
label: "power, fingers, board, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=K5NLcANk1X8"
    thumbnail_url: "https://i.ytimg.com/vi/K5NLcANk1X8/maxresdefault.jpg"
notes: |
  2–4 boulders per session on a systems board (Tension, Moon, Kilter, Grasshopper, etc.)

  Work **redpoint-level** (1–3 attempts) boulders in a wide variety of styles.

  **STOP BOARD CLIMBING THE INSTANT YOU FEEL YOUR MAXIMAL STRENGTH AND POWER DIP FROM 100%!**

  3 attempts per boulder — no matter what, you **will** do 3 attempts (or successful laps) on each boulder. If you flash it, do it in even better style for the next 3 laps.

  You will be limited to a total of 12 attempts for this drill (3 per boulder). Use them wisely. Boulders should take you between 1 and 3 attempts to send.

  The goal is to get in a lot of variety of movement at your near-limit AND repeat them. Make sure to vary grip types during the session, checking the boxes for all grips and move styles.

  Get in as many technical climbs with odd body positions as possible, with a heavy reliance on leg tension and proficiency.

  Between 3 and 6 moves in length.

  Receive 1 minute of rest per move executed on the wall.
