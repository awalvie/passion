name: "Straight Arms + Relaxed Grip"
source: "Neil Gresham"
label: "technique, endurance, balance"
kind: "session"
session_duration_seconds: 360
notes: |
  On easy overhanging or vertical terrain: hang on your skeleton.
  Arms straight, shoulders engaged, hips below hands.
  Drag fingers over holds — grip with friction, not force.

  Cue: push with legs and hinge at hips rather than pulling.
  Gresham says you cannot drill this enough — it's the first
  thing that disappears under pressure.
  Source: Neil Gresham Masterclass
