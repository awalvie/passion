notes: |
  Pick a project-level boulder you haven't done. You get 3 attempts total across the session — no more.

  The 3-strike rule forces you to approach each attempt with intention. No casual redpoints, no mindless repetition. Before each attempt, rest fully, visualize the sequence, and commit completely.

  This drill builds the mental discipline of treating every attempt as meaningful, which is a direct simulation of competition and outdoor climbing scenarios where attempts are finite.

  Between attempts, observe other climbers, rest, and refine your beta mentally. After all 3 strikes, move on — regardless of outcome.
