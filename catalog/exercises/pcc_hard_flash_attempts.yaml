name: "Hard Flash/Onsight Attempts"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=RQtii8MxjkQ"
    thumbnail_url: "https://i.ytimg.com/vi/RQtii8MxjkQ/maxresdefault.jpg"
notes: |
  Attempt boulders at or near your flash/onsight limit.

  Gather as much information as you can before your attempt: read the boulder, visualize the moves, and do your best to execute.

  You should be **failing more than 50%** of the time. If you're succeeding most attempts, aim higher. If you never succeed, back off slightly.

  After each attempt, run a post-mortem:
  - Did your expectations get in the way?
  - Were you too rigid with the beta?
  - Did an on-the-fly adjustment make the difference?

  This feedback loop is the most important part.
