name: "Directional Holds and Body Positioning"
kind: "session"
session_duration_seconds: 900
media:
  - video_url: "https://www.youtube.com/watch?v=3apLxqWvTXU"
    thumbnail_url: "https://i.ytimg.com/vi/3apLxqWvTXU/maxresdefault.jpg"
notes: |
  Run a standard warm-up boulder ladder — but make **directional opposition** your only priority.

  Every time you grab a hold, pause. Look at it. Feel its angle. Then deliberately lean or lower your body in the *opposite* direction that the hold is facing. If it's a right-facing sidepull, move your center of mass left. If it's a downward gaston, drop and oppose. Lock yourself into that tensioned, oppositional position before moving on.

  Do not rush the next move.

  From that opposition, reach for the next hold while maintaining tension against the one you are holding. Resist the urge to square up too early. Stay committed to the directional force.

  Once you secure the next hold, smoothly transfer your weight behind it. Let the transition be controlled, not abrupt. Most of the time, you will need to adjust your feet — sometimes entirely reposition them — to establish the most mechanically efficient stance. Accept that footwork is part of the solution, not an afterthought.

  This drill becomes especially obvious on poor holds. Slopers, sidepulls, and pinches immediately punish lazy body positioning. But the real growth happens when you apply the same discipline to good holds. Large edges and jugs often invite carelessness — and that carelessness leaks energy.

  Opposition is not optional. It is how you generate friction, conserve strength, and control movement.

  Treat every hold — good or bad — as directional.
  Feel where it wants you to move.
  Then deliberately move the other way.
