name: "Cable Pull-In"
kind: "reps_and_sets"
sets: 3
reps: 5
rep_seconds: 7
set_rest_seconds: 300
media:
  - video_url: "https://www.youtube.com/watch?v=CTFPbhPWVOk"
    thumbnail_url: "https://i.ytimg.com/vi/CTFPbhPWVOk/maxresdefault.jpg"
notes: |
  5 reps per side. Tempo: 2–3–2–0 (2s pulling in, 3s holding end range, 2s returning).

  **Intent of This Drill**

  Cable Pull-Ins train active hip flexion strength at long range — the ability to pull your knee high under control, not just lift it passively.

  This drill directly supports: high-stepping on the wall, bringing the foot up without momentum, keeping hips close during high feet, reducing reliance on throwing or hopping, and improved toe-hook strength.

  Flexibility gets your foot close to the hold. Strength gets it onto the hold.

  **How to Perform**

  - Attach a cable or band around the foot.
  - Lie on your back, head away from the machine.
  - Opposite leg stays bent or flat on the floor for stability.
  - Keep lower back lightly pressed into the ground.

  From here: actively pull the knee toward the same-side shoulder. Move slowly and smoothly. Hold the top position with tension. Return under full control.

  No jerking. No swinging. No momentum.

  **What You Should Feel**

  - Strong effort in the hip flexors
  - Deep abdominal engagement
  - Control at the top of the movement
  - No pinching in the front of the hip

  The effort should feel muscular, not joint-based. If your low back arches or pelvis tips aggressively, the load is too heavy.

  **Progression (Strict Order)**

  1. Improve control and smoothness
  2. Increase end-range hold time (up to 4–5s)
  3. Increase resistance slightly
  4. Only then increase knee height

  If you lose pelvic control or rush reps, regress.

  **Common Mistakes**

  - Arching the lower back to fake range
  - Using momentum to finish the rep
  - Letting the cable yank the leg back
  - Rushing the eccentric
  - Treating this like a stretch
