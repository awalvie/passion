notes: |
  Pick a boulder you haven't climbed. Observe it for 60 seconds — no touching, no beta from others. Then climb it as if it's your only attempt.

  This drill builds on-sight and flash skills: the ability to read movement, commit to a sequence under uncertainty, and execute cleanly without warm-up attempts. It trains the problem-solving brain and the execution nervous system simultaneously.

  After your attempt — success or fall — analyze what you missed. What did you misread? What was better than expected? Where did your body fail to execute what your brain intended?

  Repeat with a new problem each session. Track your flash rate over time.
