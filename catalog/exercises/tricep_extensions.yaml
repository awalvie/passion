name: "Tricep Extensions"
label: "antagonist, strength"
kind: "reps_and_sets"
sets: 1
reps: 6
media:
  - video_url: "https://www.youtube.com/watch?v=TQbUBGWrL_k"
    thumbnail_url: "https://i.ytimg.com/vi/TQbUBGWrL_k/maxresdefault.jpg"
notes: |
  Use 85% of 1RM. Can be performed with cable, dumbbell, or band (overhead or pushdown-style).

  **Setup**

  - Stand tall or kneel (overhead variations).
  - Elbows close together, upper arms relatively still throughout the set.
  - Ribcage stacked, core lightly braced, wrists neutral.

  **Extend**

  - Straighten the elbows smoothly, moving only at the elbow joint.
  - Finish with arms straight but not aggressively locked — controlled, no snapping.
  - Shoulders stay relaxed and down throughout.

  **Lower**

  - Bend the elbows slowly back to the start, maintaining tension throughout.
  - Avoid letting elbows drift outward.

  **Common Mistakes**

  - Elbows flaring out
  - Using shoulder movement to assist
  - Going too heavy and shortening range
  - Snapping into lockout
  - Letting wrists collapse

  Overhead variations emphasize the long head and are excellent for mantle-specific strength. Pushdown-style variations are more elbow-friendly and easier to control during high climbing volume weeks.
