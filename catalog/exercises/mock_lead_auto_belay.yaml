name: "Mock Lead (Auto-Belay)"
slug: "mock_lead_auto_belay"
label: "route, technique, tactics"
kind: "session"
notes: |
  No partner. Auto-belay, plus trail a 10 m rope and clip the draws as you pass.

  Train the clip: which stance, how much rope, clip low not stretched.
  Clip a few from bad stances on purpose, then reclimb and find the good one.
