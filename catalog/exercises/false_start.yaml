name: "Power Company: False Start"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=wgtip4NAsoA"
    thumbnail_url: "https://i.ytimg.com/vi/wgtip4NAsoA/hqdefault.jpg"
notes: |
  Begin each boulder, climb 2–3 moves, then down-climb to the start and begin again.

  This drill builds habit around execution and composure at the start of a problem — the most anxious, highest-stakes moment in a boulder attempt. By repeatedly simulating the start, you reinforce calm, controlled movement from the very first move.

  Additionally, down-climbing the initial moves builds proprioceptive feedback, contact strength, and intentional footwork on terrain you just climbed dynamically.

  Use moderate boulders. Focus on matching the quality of your second and third starts to your first — consistency is the goal.
