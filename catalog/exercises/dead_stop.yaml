notes: |
  After every hand placement, come to a complete, motionless dead stop before initiating the next move.

  This drill removes momentum as a crutch. You must be fully balanced and statically stable at each position before you can proceed. If you're wobbling, swinging, or shifting weight continuously, you have not stopped — reset and try again.

  The dead stop reveals where your technique and body tension are weak. When momentum is gone, every inefficiency is exposed: sagging hips, passive feet, incomplete hip engagement.

  Work ladders of easy-to-moderate boulders. The challenge is not the grade — it's achieving genuine stillness at every intermediate position.
