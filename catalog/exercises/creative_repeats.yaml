    thumbnail_url: "https://i.ytimg.com/vi/hsk9MA0Y7nc/hqdefault.jpg"
notes: |
  Repeat boulders with a different constraint each time: different sequence, opposite hand starts, no-match rule, skip a foot, use the wall instead of a hold.

  The goal is not to send — it's to explore the problem from angles that challenge your problem-solving and adaptability. Creative constraints force you to find alternative movement solutions, building a broader repertoire of body positions and sequencing options.

  Use boulders that are well within your ability. The movement creativity is the workout, not the difficulty.
