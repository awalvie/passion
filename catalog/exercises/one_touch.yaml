notes: |
  Every foot placement gets exactly one touch — no readjusting, no smearing and repositioning, no second chances.

  Place your foot on the hold and commit to that placement entirely. If it feels wrong, you must continue anyway. If you tap a foot down and lift it to retry, that counts as a failed rep — start the problem over.

  This drill builds decisive footwork. The mental pressure of a single-touch rule forces you to visualize and confirm the target before committing, then trust the placement when it lands.

  Work ladders of easy-to-moderate terrain. As the drill becomes natural, try it on problems with smaller or more technical footholds.
