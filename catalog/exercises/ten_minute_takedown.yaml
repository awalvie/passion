    thumbnail_url: "https://i.ytimg.com/vi/WMg11efY-J8/hqdefault.jpg"
notes: |
  Set a timer for 10 minutes. Pick a boulder at the top of your ability. Your goal: send it before the timer runs out.

  The time constraint forces efficiency. You cannot afford to waste attempts on casual tries — every attempt must be deliberate, rested, and executed with maximum intent. You also cannot afford to overthink: commit to beta and climb.

  The 10-minute window simulates the urgency and decisiveness required at competitions and on outdoor projects with limited conditions or daylight.

  Rest as long as needed between attempts within the window. Quality of effort over quantity of attempts.
