notes: |
  Before placing each foot, hold it just above the target hold for a full second — hovering — before committing.

  This forces you to visually confirm your foot placement, engage your hip flexors deliberately, and build the habit of precise, intentional footwork. It slows the climbing brain down and eliminates the reflexive, sloppy stamping that creeps in when climbing on autopilot.

  Work ladders of easy-to-moderate terrain. Focus entirely on the pause before every foot placement. The grade is irrelevant — the quality of the hover is everything.
