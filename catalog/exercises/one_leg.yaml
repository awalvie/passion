name: "Power Company: One Leg"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=IkVJx8gaUvE"
    thumbnail_url: "https://i.ytimg.com/vi/IkVJx8gaUvE/hqdefault.jpg"
notes: |
  Climb boulders using only one foot at a time — the other foot hangs free.

  This drill forces you to generate full stability from a single foot placement, demanding precise weighting, hip engagement, and ankle control. You cannot spread load across two feet. Every position must be earned by one leg at a time.

  Alternate which leg is active each lap. Notice the difference in stability and balance when using your dominant versus non-dominant foot.

  Use easy-to-moderate terrain. As the drill becomes easier, try it on steeper angles where single-leg balance is increasingly demanding.
