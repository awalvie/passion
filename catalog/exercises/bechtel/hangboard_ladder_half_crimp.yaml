name: "Hangboard Ladder: Half Crimp"
source: "Logical Progression"
label: "hangboard, fingers, strength"
kind: "timed_reps"
sets: 3
reps: 3
prep_seconds: 10
rung_seconds: "3,6,9"
rep_rest_seconds: 60
notes: |
  3s, 6s, then 9s hang in half crimp. Rest as needed between hangs.

  Sub-max: pick a hold you could hold for 8-12s, roughly 65-75%. You should
  never fail the 9s hang — if you do, the load is too high.

  Same hold and load for the whole 4-week cycle.
