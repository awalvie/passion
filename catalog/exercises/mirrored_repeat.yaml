name: "Power Company: Mirrored Repeat"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=3EgXORVDnbA"
    thumbnail_url: "https://i.ytimg.com/vi/3EgXORVDnbA/hqdefault.jpg"
notes: |
  After sending a boulder, repeat it using the exact mirror image of your original beta — every hand swap, every foot swap, every body position flipped.

  If you used a right-hand gaston, use a left-hand gaston. If you drop-kneed with your right knee, drop-knee with your left. If you flagged right, flag left.

  This drill directly addresses left/right asymmetry — one of the most common and overlooked limiters in climbing. Most climbers have a dominant side and unconsciously favor it constantly. Mirrored repeats force the weaker side into the same positions the strong side just executed.

  It will feel awkward. That's the point.
