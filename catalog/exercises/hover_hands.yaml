name: "Hover Hands"
source: "Self-Coached Climber"
label: "balance, technique, footwork"
kind: "session"
notes: |
  Reach for the next hold but hover your hand 2 inches above it
  for 3 full seconds before grabbing.

  If you swing, collapse, or fall — your hips and feet were wrong.
  This is a DIAGNOSTIC: if you can't hold the 3-sec hover, you're
  not actually climbing on your feet yet.

  Use it to find better hip positions: when hovering fails, try
  shifting hips left, right, closer to wall, or twisting.
  Source: Self-Coached Climber
