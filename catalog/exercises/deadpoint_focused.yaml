notes: |
  Begin with a standard warm-up ladder — but dedicate every move to intentional **deadpoint mechanics**.

  On each reach, allow your body to move *away* from the wall first. Sink into bent legs. Let the hips drift slightly back and out as your arm extends. Feel the elastic load through your lower body — this is your spring.

  From there, reverse direction sharply. Drive through your legs. Pull your hips back in toward the wall. Aim to bring them directly over your feet and as flat to the wall as possible. The movement should originate from the legs, not the arm. Your hand moves fast — but it moves because the body launched it.

  Think: load → explode → connect.

  Keep your eyes locked onto the target hold. When moving dynamically, accuracy is everything. The goal is to latch the hold at the precise moment your body reaches its closest position to the wall — or even better, as you are still moving inward.

  Once you've completed your ladder and feel fully warm, raise the coordination demand:

  Climb three V0s where **every move requires both hands to reach simultaneously**. Pull away from the wall, then snap back in and contact the next hold at peak inward momentum. This reinforces timing, symmetry, and dynamic precision.

  To progress further, perform the drill with **one arm only**. Start on vertical terrain to develop control and sequencing. As proficiency improves, gradually introduce slight overhang to increase power demand.

  The intention throughout remains the same:
  Movement begins in the legs.
  Power travels through the hips.
  Speed is expressed through the hands.
