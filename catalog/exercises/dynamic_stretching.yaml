notes: |
  # Quick Cardio + Dynamic Mobility (5–8 Minutes)

  This phase elevates heart rate, increases circulation, and restores full-body range of motion before you touch the wall. Move with intention — not fatigue.

  # Quick Cardio

  - 30 Jumping Jacks (add shoulder rotations)
  - 20 Seals
  - 20 Split Jumps

  Goal: light sweat, elevated breathing, joints feeling loose.

  # Dynamic Stretches

  *(Take big, controlled breaths as you approach end range.)*

  - 20 Trunk Twists (head and hips facing forward)
  - 20 Side Bends (one arm overhead, one reaching toward foot)
  - 5 Trunk Circles each direction
  - 8 Hip Circles each direction
  - 8 Hands-on-Knee Circles each direction
  - 10 Arm Circles each direction
  - 10 Elbow Circles each direction
  - 10 Neck Circles (optional)
  - 10 Shoulder Shrugs (optional)
  - 20 Shoulder Rotations (pinky up → thumb up)
  - 5 Standing Knee Circles each leg (both directions)
  - 10 Hip Hinges
  - 3 Table Turnovers each direction
  - 2 Full-Plank to Inch-Worms
  - 10 Leg Swings each leg (side-to-side)
  - 10 Leg Swings each leg (forward/backward)

  # Why This Matters

  This sequence:
  - Elevates tissue temperature
  - Mobilizes hips, spine, and shoulders
  - Improves joint lubrication
  - Enhances neural readiness
  - Reduces early-session stiffness

  You should finish feeling: warm, mobile, light on your feet, and ready to move dynamically.

  Now go get warmed up on the wall.
