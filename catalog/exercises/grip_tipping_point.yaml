name: "Grip Tipping Point"
kind: "reps_and_sets"
sets: 3
reps: 1
rep_seconds: 90
set_rest_seconds: 60
notes: |
  On a traverse: slowly reduce your grip until you slip.
  Add back just enough to hold on. Repeat on different holds.

  Calibrates the minimum grip you actually need.
  Cue: pretend the holds are made of glass.
  Source: Climbing Doctor / general coaching
