name: "Low Intensity Endurance (continuous boulders)"
source: "Power Company Climbing"
label: "endurance, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=KZemKtWu1Sc"
    thumbnail_url: "https://i.ytimg.com/vi/KZemKtWu1Sc/maxresdefault.jpg"
notes: |
  Spend 20–30 minutes doing continuous boulders at a warm, mild pump. You don't have to stay on the wall the entire time — drop off and walk to the next boulder without resting between boulders.

  Stay **below your anaerobic threshold**: the point above which your pump grows uncontrollably. The goal is to bump right against that threshold but not cross it. Over time, this raises the threshold so you can stay relaxed on harder and harder moves.

  After 20–30 minutes, rest 5–10 minutes and repeat for 3–4 sets (or whatever your session allows).

  **Adjusting difficulty:**
  - If you're failing often or getting really pumped, you're shooting too high.
  - If you feel no pump at all, step it up.
  - If the pump is growing, back off. If there's none, increase difficulty.

  This ability is massively underrated. If you've ever fallen off the easy climbing at the end of a boulder, this is what you need.

  These sessions don't require massive recovery and work well as a second day on.
