name: "Toe Placements"
label: "footwork, technique, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=jFTzHomU0RU"
    thumbnail_url: "https://i.ytimg.com/vi/jFTzHomU0RU/maxresdefault.jpg"
notes: |
  Run a standard boulder ladder — but instead of simply progressing to new problems, stay on the same climbs and deliberately upgrade the footwork challenge.

  Choose footholds that may not be "on route" — smaller edges, worse smears, more awkward placements — and force yourself into harder foot sequences. Repeat each boulder until the movement is clean, controlled, and technically precise. The goal is not novelty. The goal is mastery.

  Shift your attention almost entirely to how your **toes meet the hold**.

  On small footholds, place either the **very tip of your big toe** or bias slightly toward the inner or outer edge of the big toe for maximum control. Your big toe should actively dig, search, and grip — feeling for texture, micro-features, and subtle edges. Don't just step. Engage.

  On larger, sloping holds or volumes, drop your heel and smear deliberately. Let the ankle articulate. Create tension through the arch of the foot. Feel how pressing through the foot changes the position of your hips.

  Every foothold is an opportunity to generate force.
  Every ankle adjustment shifts your center of mass.

  Pay close attention to how your feet, ankles, and legs dictate hip movement — not the other way around. When the feet move with intention, the hips follow with precision.
