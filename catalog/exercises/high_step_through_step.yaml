name: "High-Step + Through-Step"
kind: "session"
media:
  - video_url: "https://www.youtube.com/watch?v=FzN01EhPqjc"
    thumbnail_url: "https://i.ytimg.com/vi/FzN01EhPqjc/maxresdefault.jpg"
  - video_url: "https://www.youtube.com/watch?v=RlbrRgux9tA"
    thumbnail_url: "https://i.ytimg.com/vi/RlbrRgux9tA/maxresdefault.jpg"
notes: |
  Do a normal warm-up boulder ladder, but use ANY FEET that are available to you on the wall. Do every boulder twice.

  First, do the boulder by getting one foot as high as possible on every move and focus on turning your hip out and sometimes (but much more rarely) in, and pulling your body as flat to the wall as possible. If you are reaching your right hand to the next hold, bring your right foot up. Make sure to use active ankles to create a strong shelf of support to load your leg and body-weight onto.

  Next, do the boulder again, and for every single move, you will cross your foot across your body's midline and then flag the other leg in the same direction you moved the other leg towards in order to create balance with cross body tension. If you are going to reach with your right hand to the next hold, cross your right foot through and flag your left foot for balance before you reach with your right hand. Then cross your left foot through and flag your right foot through before you reach with your left hand.

  This will feel most natural on side-pulls!
