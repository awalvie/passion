name: "Foot Switching"
label: "footwork, technique, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=ODMuRgduTds"
    thumbnail_url: "https://i.ytimg.com/vi/ODMuRgduTds/maxresdefault.jpg"
notes: |
  Do a normal warm-up boulder ladder. For every move, you are required to switch feet a minimum of 2 TIMES on every single foothold before reaching to the next hand.

  Do this by either matching your feet on the same hold OR if the hold is too small, very quickly and carefully "hopping/swapping" your feet.

  Matching feet will require you to aim and share the holds with the tip of your big toe. You may have to wiggle your toes on and off the hold and play a game of give and take. If you know you will be switching feet, try not to place the initial foot in a spot that will not allow the incoming foot to have any room to match.

  If you are hopping/swapping feet, place your incoming foot over the initial foot by lining up your big-toe tip over the other toe and lightly pressing on it. Then, pull out the initial foot and push down hard with the incoming foot to replace the foot on the hold. This will take careful practice over YEARS to master, so be patient.

  Make sure that when you have switched feet, the correct foot is on in order to allow for cross body tension for the next move (OR you may move your feet to new holds to do the next hand movement). Make sure to switch feet after every hand move.
