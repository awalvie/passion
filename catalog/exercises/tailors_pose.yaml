name: "Tailor's Pose"
label: "mobility, strength"
kind: "timed_reps"
sets: 2
reps: 6
rep_seconds: 6
rep_rest_seconds: 3
set_rest_seconds: 30
prep_seconds: 5
media:
  - video_url: "https://www.youtube.com/watch?v=RAfCOcAaBSs"
    thumbnail_url: "https://i.ytimg.com/vi/RAfCOcAaBSs/maxresdefault.jpg"
notes: |
  **Intent of This Drill**

  This is not a stretch. This is a strength-based adductor loading drill in full knee flexion.

  Goals:
  - Improve adductor tolerance in deep flexion
  - Build end-range control
  - Reinforce anterior pelvic positioning
  - Correct left-right asymmetries
  - Prepare the hips for deeper split work later in the session

  This drill builds the base that your side split depends on.

  **How to Perform**

  - Sit with your back against a wall.
  - Bring the soles of your feet fully together (toe to heel contact).
  - Sit tall with a high chest.
  - Do not grab your feet.
  - Do not press your knees down with your hands.

  Instead: actively pull your knees down by contracting your glutes.

  Lower for 2 seconds. Pause at the bottom for 3 seconds. Return to start in 1 second. No pause at the top.

  Tempo: 2–3–1–0

  **What You Should Feel**

  - Deep adductor tension
  - Active effort to hold the bottom position
  - Mild muscular fatigue
  - No sharp joint pain

  If you feel pinching in the hip capsule, knee discomfort, or numbness — stop and adjust range.

  **How to Approach This Mentally**

  Do not try to force depth. Own the range you have. Actively pull yourself deeper. Think "strength at the bottom," not "collapse into stretch."

  You are building structural capacity — not chasing flexibility PRs.

  **Progression (Strict Order)**

  Do NOT increase reps weekly. Progress in this order:

  1. Improve positioning and symmetry
  2. Own the full 3-second pause without shaking
  3. Increase depth slightly
  4. Add load (2.5–5kg per side)

  Load is only added once: knees descend evenly, no side shift, no compensation, and the 3-second pause is stable.

  If asymmetry is present: match depth to weaker side. Never let the stronger side go deeper.

  **Deload Weeks**

  Reduce sets by 40–50%. Maintain tempo, position, and quality. Do not push depth.

  **Common Mistakes**

  - Grabbing feet and pulling
  - Collapsing chest
  - Rounding lower back
  - Letting one knee drop lower than the other
  - Speeding through reps
  - Increasing reps instead of improving quality

  **When This Drill Has Worked**

  You will notice: deeper horse stance comfort, more stable drop stance, less groin tightness during wide climbing, improved control in side split holds.
