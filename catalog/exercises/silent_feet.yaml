name: "Silent Feet"
source: "Neil Gresham"
label: "footwork, technique"
kind: "session"
session_duration_seconds: 480
notes: |
  Climb easy terrain (V1-V2 / 5.8-5.9) placing every foot with zero sound.
  Five cues to cycle through:
  1. HOVER — pause your toe above the hold before placing
  2. NO SCUFF — never drag your toe down the wall
  3. FIRST TIME — nail the placement, no micro-shuffles
  4. NO TEST — don't bounce-test the foot once placed
  5. EYE ON THE BALL — watch your foot until it's fully weighted

  If you hear your foot, redo the move slower.
  Source: Neil Gresham Masterclass, Self-Coached Climber
