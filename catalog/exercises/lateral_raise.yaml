name: "Lateral Raise"
label: "antagonist, strength"
kind: "reps_and_sets"
sets: 3
reps: 10
set_rest_seconds: 60
media:
  - video_url: "https://www.youtube.com/watch?v=f_OqG2XaF_4"
    thumbnail_url: "https://i.ytimg.com/vi/f_OqG2XaF_4/maxresdefault.jpg"
notes: |
  Use 85% of 1RM. Can be performed with dumbbells or cable.

  **Setup**

  - Stand tall, feet hip-width apart, dumbbells at sides or cable set low.
  - Arms relaxed, palms facing in (neutral grip), elbows slightly bent (~10–20°).
  - Ribcage stacked, light core engagement, shoulders relaxed (not shrugged).

  **Raise**

  - Lift arms outward and slightly forward in the scapular plane (~30° forward of pure side).
  - Lead with the elbows, not the hands.
  - Raise until arms reach about shoulder height — elbows slightly higher than wrists.
  - No swinging, no shrugging at the top.

  **Lower**

  - Lower slowly back to the start, maintaining control and tension the entire way down.

  **Common Mistakes**

  - Using momentum or leg drive
  - Shrugging the shoulders
  - Raising arms too high
  - Internally rotating the shoulders (thumbs down)
  - Going too heavy

  Cable variation provides constant tension through the full range and is excellent for shoulder health.
