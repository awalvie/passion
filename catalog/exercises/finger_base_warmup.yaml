  # 10–15 Minute Finger Prep (Pre-Climb)

  Do this before you touch the wall to reduce injury risk and improve finger readiness.

  **1. Heat (Optional but Recommended)**

  30–60 sec warm/hot water on hands. (Gloves if skin gets too soft.)

  **2. Tendon + Wrist Mobility**

  3 sets:
  - 20 Tendon Glides
  - 20 Wrist Extensions
  - 20 Wrist Flexions
  - Rest 30 sec between sets

  **3. Light Forearm Pump**

  5–10 min squeezing Nee Doh or putty. Alternate hands. Keep it rhythmic — not fatiguing.

  **4. Light Finger Activation**

  3 sets of 20 per hand banded finger curls (or light hangboard curls with feet on ground).

  You should finish warm and responsive — not pumped.

  Then move into your dynamic stretches and full warm-up on the wall.
