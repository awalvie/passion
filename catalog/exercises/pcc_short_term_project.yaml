name: "Short-Term Project"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=RQtii8MxjkQ"
    thumbnail_url: "https://i.ytimg.com/vi/RQtii8MxjkQ/maxresdefault.jpg"
notes: |
  Work a project boulder that should take roughly 3–5 sessions to send.

  Efficient tactics matter here — the goal is to send as quickly as possible. After the project:
  - If it only took a few tries, what caused you to aim too low?
  - If it took more than 5 sessions, why?

  Use the **seven try rule** if you're stuck on a move: give 7 honest efforts. If you make any progress, however small, keep going. If you make zero progress in 7 tries, move the move to an explore day or come back later.
