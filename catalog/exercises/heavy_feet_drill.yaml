name: "Heavy Feet"
kind: "reps_and_sets"
sets: 3
reps: 1
rep_seconds: 120
set_rest_seconds: 60
notes: |
  Warm-up drill. Easy traverses or vertical climbing.
  Imagine being heavy through your legs. Push all weight down
  into your feet. Climb from the legs, not the arms.

  Purpose: jump-start awareness of your lower body.
  Source: Power Company / Kris Hampton
