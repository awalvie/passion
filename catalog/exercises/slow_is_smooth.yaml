notes: |
  Climb each problem three times: once at 25% speed, once at 50%, once at full speed.

  The slow pass forces you to notice every detail — balance points, hip positions, foot precision, grip pressure. The medium pass lets you feel the sequence with some fluidity. The full-speed pass should now feel easier, more automatic, and more efficient than if you had simply tried hard from the start.

  The principle: precision built slowly transfers to speed. Speed built without precision just entrenches bad habits faster.

  Use problems in the moderate range — hard enough that technique matters, easy enough to complete each pass successfully.
