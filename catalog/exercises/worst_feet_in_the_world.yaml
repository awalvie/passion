name: "Power Company: The Worst Feet in the World"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=gx4vg1Rs0uQ"
    thumbnail_url: "https://i.ytimg.com/vi/gx4vg1Rs0uQ/hqdefault.jpg"
notes: |
  Climb problems using only the worst, most awkward footholds available — smears, slopers, wall features, the least obvious options.

  Ignore the "real" footholds. Make every foot placement as challenging as possible. This drill forces you to generate stability from terrible foot positions, building ankle strength, smearing technique, and the habit of committing body weight to imperfect feet.

  Climbers who can use bad feet confidently are harder to stop on any terrain. Climbers who only work well when foot placements are obvious are limited to gyms with obvious footholds.

  Use moderate problems. Focus on generating real, weighted contact with each terrible foothold rather than just touching it.
