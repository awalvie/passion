name: "Power Company: Hand/Foot Match"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=wKuhN7u1WQ0"
    thumbnail_url: "https://i.ytimg.com/vi/wKuhN7u1WQ0/hqdefault.jpg"
notes: |
  After every hand move, match your foot to the same hold your hand just left.

  This drill forces you to use your feet high and aggressively, constantly cycling your lower body up the wall alongside your hands. It builds hip flexibility, high-stepping habit, and active foot use on terrain where climbers typically leave their feet low and pull with their arms.

  The constraint also develops the spatial awareness to identify which footholds are viable for feet immediately after they were used for hands.

  Use easy-to-moderate boulders. Focus on committing fully to each hand/foot match — don't skip the match or cheat to a nearby foothold.
