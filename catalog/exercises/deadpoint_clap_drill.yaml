name: "Deadpoint / Clap Drill"
source: "Catalyst Climbing"
label: "dynamic, power, technique"
kind: "reps_and_sets"
sets: 3
reps: 5
rep_seconds: 10
set_rest_seconds: 120
notes: |
  Two options (pick one per session):

  DEADPOINT: Straight-arm start → drop hips → drive from legs →
  float to hold at the apex. Eyes locked on target. 3-5 deliberate
  attempts with full rest between.

  CLAP DRILL: On easy terrain, clap hands at the top of each move.
  Clap in front of chest = easy. Overhead = harder. Behind back = hardest.
  Trains deadpoint timing and commitment.
  Source: Catalyst Climbing / Louis Parkinson
