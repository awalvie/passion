name: "Bench Press"
label: "strength, antagonist"
kind: "reps_and_sets"
sets: 1
reps: 6
media:
  - video_url: "https://www.youtube.com/watch?v=9FImGAOPysY"
    thumbnail_url: "https://i.ytimg.com/vi/9FImGAOPysY/maxresdefault.jpg"
notes: |
  Use 85% of 1RM. Can be performed with barbell or dumbbells.

  **Setup**

  - Lie flat on the bench with eyes directly under the bar (barbell) or dumbbells resting on thighs (DB).
  - Feet planted firmly on the floor, slightly wider than hip-width.
  - Create full-body tension: light arch in upper back, shoulder blades pulled down and together, chest tall.
  - Grip (barbell): hands just outside shoulder width, wrists stacked over elbows.
  - Grip (dumbbells): neutral or slight pronation, palms facing forward or slightly angled inward.

  **Descent**

  - Lower the weight under control toward the mid-chest.
  - Elbows track naturally — not flared wide, not pinned tight.
  - No dropping into the bottom.

  **Bottom Position**

  - Bar lightly touches the chest (barbell) or dumbbells reach chest depth.
  - Forearms vertical. No bouncing. No relaxing tension.

  **Press**

  - Drive the weight upward, pressing feet into the floor and keeping shoulder blades retracted.
  - Bar path moves slightly up and back toward the shoulders.
  - Finish with elbows locked, chest tall, no shoulder shrugging.

  **Breathing**

  - Inhale deeply before lowering. Brace the core.
  - Exhale through the sticking point or after lockout.
  - On heavy sets, use a brief breath hold to maintain trunk stiffness.

  **Common Mistakes**

  - Elbows flaring excessively
  - Losing upper-back tension
  - Bouncing the bar off the chest
  - Wrists collapsing backward
  - Feet lifting or shifting during the press

  This should support climbing, not interfere with it. Err on the side of leaving reps in reserve unless specifically prescribed otherwise.
