name: "Heel Hooks and Toe Grabbing"
kind: "session"
session_duration_seconds: 900
media:
  - video_url: "https://www.youtube.com/watch?v=u8faToBNnao"
    thumbnail_url: "https://i.ytimg.com/vi/u8faToBNnao/maxresdefault.jpg"
notes: |
  Do a normal warm-up boulder ladder, but use ANY FEET that are available to you on the wall. Do every boulder twice.

  First, do every boulder by using a heel hook AT LEAST 3 times on the wall (this will take careful selection of climbs and holds). Do this by placing your heel on the hold that faces away from your body (right feet should be placed on a hold that faces right), pointing your toe down with a tight ankle, and pulling towards your body or into the face of the hold by flexing your hamstring. Then reach for the next hold. If you are reaching for a right hand hold next, place the heel-hook with your right leg BEFORE you reach with the right hand. For all heel hooks, make sure that you are actually hooking the hold and not just resting your heel on the hold! We hook holds by pointing the toes down as hard as possible to claw into holds and get maximal grip and control.

  Next, do the boulder again, but this time, do the same exact action, but place and grab the hold with your big toe instead of your heel. This will result in less strength, but is a KEY technique to use when holds are too far away for a heel, too small/poor to place an effective heel-hook, or directly in front of us.

  In both cases (heel or toe) focus on engaging the foot muscles, then calf, then hamstring, then your glute and finally your core muscles!
