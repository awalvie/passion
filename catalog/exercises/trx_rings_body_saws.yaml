name: "TRX/Rings Body Saws"
kind: "reps_and_sets"
sets: 1
reps: 6
media:
  - video_url: "https://www.youtube.com/watch?v=5AeKcMpqK2g"
    thumbnail_url: "https://i.ytimg.com/vi/5AeKcMpqK2g/maxresdefault.jpg"
notes: |
  Use 85% of max effort. Feet in TRX straps or rings, hands on floor under shoulders, strong high-plank (hollow-body) position.

  **Body Saw Back**

  - Slowly shift your body backward by pushing through the hands.
  - Body remains rigid from shoulders to heels — the spine does not move.
  - Stop just before you lose rib or pelvic control. Range is earned, not forced.

  **Pull Forward**

  - Use the core and lats to pull the body forward back to start.

  **Common Mistakes**

  - Letting the lower back arch (critical — do NOT do this)
  - Losing ribcage position
  - Shrugging or dumping into the shoulders
  - Rushing reps or bouncing
  - Increasing range before earning control

  Progress by increasing range and control, not speed or reps. Regress to elbows or shorter range if position breaks down.
