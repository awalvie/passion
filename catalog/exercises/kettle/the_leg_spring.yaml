name: "The Leg Spring"
source: "John Kettle"
label: "footwork, power, dynamic"
kind: "session"
media:
  - video_url: "https://www.youtube.com/watch?v=rjdWKkGPOOg"
    thumbnail_url: "https://i.ytimg.com/vi/rjdWKkGPOOg/hqdefault.jpg"
notes: |
  Drop down onto your lower leg, then spring up off it to place your foot on a new, higher hold. All the power comes from the lowest leg — the arms just guide. Explosive, so warm up first.
