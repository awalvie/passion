name: "The Tension Tester"
source: "John Kettle"
label: "tension, tactics, route"
kind: "session"
notes: |
  Before each clip, run one round of progressive muscle relaxation: tense a muscle group to 10/10 for 5 seconds, then release to 0. Cycle through calves, shoulders, hands, jaw, belly across the route. Finds and dumps hidden tension.
