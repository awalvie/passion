notes: |
  Three problems, each climbed twice:
  - SLOTH: uncomfortably slow, deep lock-offs, controlled, close to wall
  - MONKEY: uncomfortably fast, swingy, momentum-driven — OK to fall

  Whichever side feels worse is your growth edge.
  The sloth teaches tension and position.
  The monkey teaches that momentum is a tool, not a mistake.
  Source: Power Company / Kris Hampton

  On the sloth side: climb as slowly as possible. Every move should be deliberate, controlled, and silent. Before placing a hand or foot, pause. Hold the position. Feel the tension in your body. Then move — but at a fraction of your normal pace. The goal is to remove all momentum from your climbing; every gain must be earned through static strength and body tension, not speed or swing.

  This drill exposes every weakness in your movement. When you eliminate momentum, you can no longer hide poor technique behind dynamic flair. Sloppy hip positioning becomes immediately apparent. Inefficient foot placements force muscular compensation.

  Work ladders of easy-to-moderate boulders. The grade doesn't matter — the quality of movement is everything. Progress: once you can climb a problem sloth-slow with full control, add an exaggerated 2–3 second pause at every hand and foot placement.
