notes: |
  Return to a boulder you've already sent. You get exactly 3 attempts to repeat it — no more.

  Unlike the newcomer version of 3 Strike, you already know the beta. The challenge here is execution: can you climb it cleanly, efficiently, and confidently with limited attempts? Each attempt should improve on the last — better footwork, smoother transitions, less unnecessary grip tension.

  This drill trains redpoint consistency and execution quality on familiar terrain. It also builds the habit of analyzing and improving on known sequences rather than just grinding them.
