notes: |
  Warm up and cool down by climbing with a consistent, metronomic rhythm.

  Choose a pace — one move every 2 seconds, or 3 seconds, or whatever feels sustainable — and maintain it throughout. Every hand move and every foot move happens exactly on beat. No rushing, no stalling.

  Rhythm drill builds movement economy and mental consistency. A climber with a good rhythm wastes less energy hesitating, overshoots fewer holds, and manages fear better on hard moves.

  For warmup: start slow and easy, increasing pace slightly over the first few laps as blood flows. For cooldown: use very easy terrain and slow the pace intentionally, bringing heart rate and attention down deliberately.
