name: "Flagging Perfection"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=lAbQ41NOabA"
    thumbnail_url: "https://i.ytimg.com/vi/lAbQ41NOabA/maxresdefault.jpg"
notes: |
  Run a standard warm-up boulder ladder — but climb each problem twice with a unilateral constraint.

  On the first ascent, allow **only your right foot** to use footholds during reaches with the hand. On the second ascent, allow **only your left foot** to touch holds during reaches with the hand. The non-working foot may contact the wall — but it may only smear. No edges. No footholds. No cheating.

  IMPORTANT: When moving feet to do the next hand reach, you may use both feet to touch and step on holds. However, before you make the next move with the hand, the leg that is not the focus of this lap must come off.

  This instantly forces you into intentional balance.

  Commit to perfect flag mechanics. Use an **active flag**, pressing the free leg firmly into the wall to stabilize your center of mass. Drive through the smear — don't let it float. Feel how pushing into the wall locks your hips into position and counteracts barndooring.

  Explore **back flags** to conserve energy and maintain tension when the body wants to swing open. Experiment with **through flags** — less common, but incredibly effective when moving across your body without needing a foot switch. These variations can reduce unnecessary movement and improve flow.

  Your flagging leg is not passive. It is a stabilizer. A brake. A steering wheel.

  As the ladder progresses, the movement patterns will become strange. You'll be forced into unconventional body positions and unexpected solutions. That's the point.

  Lean into the awkwardness.
  Experiment.
  Commit to balance before movement.

  Expanding your movement vocabulary — especially under constraint — is one of the fastest ways to refine technique and improve efficiency on real climbs.
