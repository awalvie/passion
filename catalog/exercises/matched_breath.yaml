notes: |
  Breathe deliberately and intentionally throughout every problem — one exhale per move.

  Most climbers hold their breath under effort, spiking tension and reducing endurance. The matched breath drill trains you to exhale on each reach, using the breath as a pacing mechanism and a signal to release unnecessary muscular tension.

  Inhale while setting feet and preparing to move. Exhale as you reach. If you reach without exhaling, stop and reset.

  Use this drill during warmup ladders and easy-to-moderate problems. The habit formed here will carry forward into hard climbing automatically over time.
