name: "Pigeon Pose"
label: "cooldown, mobility"
kind: "timed_reps"
sets: 1
reps: 2
rep_seconds: 60
set_rest_seconds: 0
prep_seconds: 10
media:
  - video_url: "https://www.youtube.com/watch?v=0RQVD6viVXo"
    thumbnail_url: "https://i.ytimg.com/vi/0RQVD6viVXo/maxresdefault.jpg"
notes: |
  Front shin as close to parallel as the hip allows — not tucked under you.
  That angle is the whole point of the stretch.

  Hips square, don't let the front ankle roll. 60s each side.
