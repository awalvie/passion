name: "General Warmup"
label: "warmup, mobility"
kind: "reps_and_sets"
sets: 1
reps: 1
rep_seconds: 600
set_rest_seconds: 0
notes: |
  5 min pulse-raiser (light jog, skipping, jump rope).
  5 min dynamic mobility (shoulder circles, hip rotations,
  leg swings, arm swings, band work for rotator cuff).
  Then easy traversing/climbing for 2-3 min.
