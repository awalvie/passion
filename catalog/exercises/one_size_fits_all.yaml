notes: |
  Climb every problem with the same body position or technique, regardless of whether it is the optimal solution.

  Pick a constraint — for example, always use a drop knee, always flag, always open hip — then apply it universally. Problems that don't naturally call for your chosen technique become the training ground for adaptation and problem-solving.

  This drill develops the ability to execute a specific movement pattern under varying demands, and reveals how much range and versatility you actually have in that technique.

  Rotate which technique you impose across sessions to build a well-rounded toolkit.
