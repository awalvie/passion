name: "Drop-Knees and Perching"
label: "technique, footwork, balance, boulder"
kind: "climbing"
media:
  - video_url: "https://www.youtube.com/watch?v=fDqotYWElcs"
    thumbnail_url: "https://i.ytimg.com/vi/fDqotYWElcs/maxresdefault.jpg"
notes: |
  Run a standard warm-up boulder ladder — but climb each problem twice with two distinct lower-body intentions.

  On the first ascent, deliberately choose footholds that are positioned **wide** — further apart than shoulder width whenever possible. From these wide stances, execute a drop-knee on as many moves as the terrain allows.

  When reaching with your right hand, twist your **right knee downward and inward**, toward your body. When reaching with your left hand, rotate your **left knee downward and inward**. Actively push outward through the feet to create lateral tension. This outward pressure allows you to press your hips into the wall and bring your working shoulder closer to the next hold.

  The goal is to feel how wide feet and inward knee rotation create compression, proximity, and mechanical advantage.

  On the second ascent, shift your focus to **perching**.

  Place a foot on a hold, then intentionally move your hips directly over it. Try to "sit" on that foothold — transferring as much bodyweight as possible into the leg. You may use either open-hip or closed-hip positioning, depending on what the move demands. The key is commitment: don't hover. Fully load the foot.

  This variation teaches you how to trust your lower body and reduce unnecessary pulling with the arms.

  The contrast between wide drop-knee tension and vertical perching reveals two critical truths:

  - Lateral pressure creates closeness and reach.
  - Vertical loading creates rest and efficiency.

  Both are foundational. Both require practice.
  Mastering them will dramatically improve movement economy and control.
