name: "Scapular Pulls & Push-Ups"
label: "warmup, antagonist, shoulder"
kind: "timed_reps"
sets: 2
reps: 2
rep_seconds: 40
rep_rest_seconds: 20
set_rest_seconds: 30
prep_seconds: 5
notes: |
  Two stations, 40s each, twice through. Easy effort.

  1. Hang from a bar or jug. Pull the shoulders down and back, then let them
     rise. No elbow bend.
  2. Push-ups, slow. Knees down when the reps get ugly.

  Stop each station with reps in the bank.
