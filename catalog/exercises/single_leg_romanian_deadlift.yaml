name: "Single Leg Romanian Deadlift"
label: "strength, mobility"
kind: "reps_and_sets"
sets: 1
reps: 6
media:
  - video_url: "https://www.youtube.com/watch?v=hBN0V2WMXhE"
    thumbnail_url: "https://i.ytimg.com/vi/hBN0V2WMXhE/maxresdefault.jpg"
notes: |
  6 reps per side. Use 85% of 1RM.

  **Setup**

  - Stand tall holding weight in one or both hands. Shift onto the working leg.
  - Working foot rooted through heel and mid-foot, toes relaxed.
  - Soft bend in the working knee, spine neutral, hips square to the floor.

  **Hinge**

  - Push the hips straight back — reach the hips back, not the chest down.
  - Let the torso hinge forward as the rear leg extends behind you.
  - Keep hips level and square throughout.

  **Bottom Position**

  - Torso nearly parallel to the floor (as mobility allows), weight close to the working leg, hamstring under tension.
  - No rounding. No twisting.

  **Stand Up**

  - Drive through the heel of the working leg and squeeze the glute to return upright.
  - Complete all reps on one side before switching.

  **Common Mistakes**

  - Opening or twisting the hips
  - Rounding the spine
  - Turning it into a squat
  - Letting the weight drift away from the leg

  If balance limits hinge quality, regress the stance before increasing load. Use a kickstand or slider-assisted variation as a regression.
