id: 9aefe2b0-fec2-4146-b94c-b804d52f5114
name: Face Pulls
style: reps_and_sets
tags:
    - antagonist
    - strength
sets: 3
reps: 15
set_rest_seconds: 60
media:
    - url: https://www.youtube.com/watch?v=eTCBSFlCJ_s
      thumb_url: https://i.ytimg.com/vi/eTCBSFlCJ_s/maxresdefault.jpg
notes: |-
    Rope or band at face height. Pull to your forehead, elbows high, thumbs
    back at the end.

    Light. Squeeze the shoulder blades together — don't lean back to move
    more weight.
