id: d186fb78-c3ad-4c5a-86f6-d1218056bede
name: Weighted Pull-ups
style: reps_and_sets
tags:
    - power
    - strength
notes: |-
    Overhand grip, hands at shoulder width or a little wider. Set the shoulders
    before you pull: blades down and back, chest up.

    Drive the elbows down towards your ribs and keep the body still, with no
    swing or kick. Pull until your chin clears the bar, then take 3–4 s to
    lower to straight arms.

    Pick a load that keeps every rep looking the same. End the set when the
    reps change: a swing, a short top, a kick. Add weight only once every set
    goes clean.
source: Paradigm Climbing
