name: Deep Wide Squat
style: open
tags:
    - cooldown
    - mobility
notes: |-
    Two holds of 60s.

    Feet wide, toes slightly out. Sink all the way down, elbows inside the
    knees, pushing them open.

    Heels stay down. If they lift, narrow the stance until they don't.
