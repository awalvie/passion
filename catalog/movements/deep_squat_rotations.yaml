id: 05c62d1e-e811-4c95-8570-1d421ec1e3d2
name: Deep Squat Rotations
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
per_side: true
sets: 2
reps: 5
notes: |-
    Get into a deep squat position.
    Reach one arm as high and far back as possible, thumb going backwards.
    Keep knees stable — don't let them cave in.
    Focus on maximum spinal rotation and arm reach. One set per arm.
