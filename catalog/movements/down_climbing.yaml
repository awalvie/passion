name: Down-Climbing
style: climbing
tags:
    - boulder
    - footwork
    - technique
notes: |-
    Climb every boulder in the ladder up and back down. No jumping off.

    Going down forces you to look at your feet and trust them. Slow is the point.

    Too hard on the way down? Drop a grade, not the drill.
