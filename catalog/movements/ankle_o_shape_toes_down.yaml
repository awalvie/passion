id: c04559b3-9b53-4946-9632-8478959cc5b6
name: Ankle O-Shape (Toes Down)
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
sets: 2
reps: 5
notes: |-
    Stand on one foot, other foot's toes on the ground, heel in the air.
    Draw an O-shape with the heel — as wide and big as possible.
    Keep knee stable. One set per foot.
