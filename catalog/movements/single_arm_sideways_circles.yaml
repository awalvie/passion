id: 43e5eb40-bd39-4f2b-aba3-4d3ae011c05c
name: Single Arm Sideways Circles
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
sets: 2
reps: 5
notes: |-
    Same as arm circles but in the lateral axis (arm moves sideways).
    Palm up on the way up, rotate, palm down on the way down.
    Repeat other direction, then switch arms.
    Keep shoulders wide and square.
