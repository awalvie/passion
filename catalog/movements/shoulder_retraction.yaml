id: 153ac87e-13e7-451c-8513-e6b292702c8f
name: Shoulder Retraction
style: climbing
tags:
    - shoulder
    - technique
notes: |-
    Easy terrain, big holds, slow.

    On every hold start from a straight arm. Draw the shoulder down, away from the ear, hold it
    1 s, then bend the arm and move. Keep it set on the way down too.

    Down and engaged, not squeezed hard back. 2-3 laps.
