name: Pogo Limb
style: climbing
tags:
    - boulder
    - dynamic
    - technique
notes: |-
    Climb one easy problem four times. Each lap, one limb never touches the wall.
    Swing that limb to make the momentum for every move.

    Pogo onto a foothold and stand up into the hand, rather than slamming into the wall.
    If a position needs a hard squeeze to hold, move on instead.
source: Catalyst Climbing
