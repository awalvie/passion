name: Fluid Style
style: climbing
tags:
    - balance
    - endurance
    - technique
source: Neil Gresham
notes: |-
    Flow through positions instead of stopping in them.

    Climb slowly at first — fluid is not fast. Rush and your feet go.
    Advanced: if you're in the F6s, solid balanced shapes matter more than flow.
