name: 90° Arm Rotations (Thumbs & Pinkies)
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
sets: 2
reps: 5
notes: |-
    Arms at 90° in front, thumbs touching, elbows touching. Shoulders pressed down.
    Rotate thumbs apart, then bring thumbs and elbows back together.
    Second set: pinkies touching — rotate pinkies apart and back.
