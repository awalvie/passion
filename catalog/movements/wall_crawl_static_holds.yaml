notes: |-
    Pull on two holds you want to feel stronger on. Juggiest feet available.
    Hold the position 3-5s.

    Easier or harder: foot holds, wall angle, or give one hand a better hold to
    take load off the bad one.

    Project-specific: make the position easier and work up to 15s holds.

    A few sets of a few holds. Rest 5 min between.
