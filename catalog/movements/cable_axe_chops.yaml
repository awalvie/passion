id: 91892b2d-ee99-4c5c-8e67-4787b5abd4e5
name: Cable Axe Chops
style: reps_and_sets
tags:
    - core
    - strength
per_side: true
sets: 3
reps: 10
set_rest_seconds: 60
media:
    - url: https://www.youtube.com/watch?v=Gwcf4TOj1hc
      thumb_url: https://i.ytimg.com/vi/Gwcf4TOj1hc/maxresdefault.jpg
notes: |-
    Cable set high, rope or single handle. Chop down and across the body,
    finishing at the opposite hip. 10 each side.

    Turn from the hips and trunk, back heel pivoting — arms stay long. If only
    your arms are moving, drop the weight.

    A band anchored high does the same job away from the gym.
