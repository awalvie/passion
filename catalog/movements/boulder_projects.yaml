name: Boulder Projects
style: climbing
tags:
    - boulder
    - power
notes: |-
    Pick two or three boulders you cannot do yet. Work them.

    Full rest between attempts — 3 to 5 min. A tired attempt teaches you nothing.

    Stop when the attempts stop improving, not when you are wrecked.
