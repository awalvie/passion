id: c954eb9b-cf66-44d3-90b2-55389d9201da
name: Thumbs Up / Down
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
sets: 1
reps: 5
notes: |-
    Arms at sides, thumbs leading upward as high as possible.
    On the way down, reach backwards to stretch the shoulders.
    Repeat with pinkies leading (pinky up / pinky down).
    Focus on maximum range of motion at a controlled, flowing pace.
