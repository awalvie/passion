id: e085bf5e-d936-4cd2-81cb-e4070794ed27
name: Cossack Squat
style: reps_and_sets
tags:
    - mobility
    - strength
sets: 2
reps: 5
set_rest_seconds: 60
media:
    - url: https://www.youtube.com/watch?v=JaCbmoDqUc4
      thumb_url: https://i.ytimg.com/vi/JaCbmoDqUc4/maxresdefault.jpg
notes: |-
    Wide stance. Sink onto one leg, other leg straight with the toe up.
    Slow down, slow up.

    A light weight held at the chest helps you get deeper. Stop at the depth
    where the pelvis starts to tuck under.
