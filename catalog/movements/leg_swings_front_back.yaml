id: 9387b94e-8f2b-4a40-9a61-be0998caf729
name: Leg Swings (Front / Back)
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
per_side: true
sets: 2
reps: 5
notes: |-
    Stand on one leg, swing the other leg forward and backward.
    Keep toes pointing upward throughout. Controlled movement, not overly dynamic.
    Feel the calf stretch forward, thigh stretch backward. One set per leg.
