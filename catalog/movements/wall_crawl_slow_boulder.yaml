source: Tyler Nelson
media:
    - url: https://www.youtube.com/watch?v=19y3Pa9nUHc
notes: |-
    Set 6-12 moves on bad holds with the juggiest feet you can find. Climb it
    slowly, holding each position 3-5s between moves. 30-60s to the top.

    Crimps, pockets, pinches — whatever you want more exposure on. Hard climbing
    only gives you a fraction of a second on a hold; this gives you seconds.

    Three crawls, each a bit harder. Rest 5 min between.
