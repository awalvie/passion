name: Max Lifts (power)
style: reps_and_sets
tags:
    - fingers
    - hangboard
    - power
    - strength
notes: |-
    One-second lifts off a 20–30 mm edge at 80% of your max. Fast off the floor, not a jerk.
    Warm up: 8 reps at 40% and 50%, then 6 at 60% and 70%.
    Lifting a block from the floor: drive with the legs and squat properly. On a hangboard: lift your feet.
    Finish with the fingers still fresh.
sets: 2
reps: 4
set_rest_seconds: 180
source: Tension Climbing
