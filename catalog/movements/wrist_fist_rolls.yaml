id: 458c2c2b-2bdf-43fe-b424-6ee9d0f44ecb
name: Wrist Fist Rolls
style: reps_and_sets
tags:
    - mobility
    - warmup
source: Adam Ondra
sets: 1
reps: 5
notes: |-
    Arms extended forward, fingers fully extended.
    Tuck thumb into palm, crimp fingers over thumb tightly.
    Flex wrist down (max range), bring fists close to body.
    Flip fists upward (feel the stretch), extend arms out again.
    Maintain finger squeeze throughout — don't let fingers release when flipping.
