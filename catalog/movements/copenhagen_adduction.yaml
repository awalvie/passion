id: 3ee000ba-5d5b-43db-b7af-1b8388a09310
name: Copenhagen Adduction
style: reps_and_sets
tags:
    - antagonist
    - mobility
    - strength
sets: 2
reps: 6
set_rest_seconds: 60
media:
    - url: https://www.youtube.com/watch?v=kD1t1hWzIDE
      thumb_url: https://i.ytimg.com/vi/kD1t1hWzIDE/maxresdefault.jpg
notes: |-
    Side plank with the top foot on a bench or chair. Lift the bottom leg up
    to meet it, then lower slowly.

    Start with the top knee on the bench, not the ankle. This is the groin
    injury insurance — keep it light and never push through a twinge.
