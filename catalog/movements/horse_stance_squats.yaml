id: 673fc4e2-4c4f-493e-8d78-e2773c63a35d
name: Horse Stance Squats
style: timed_reps
tags:
    - mobility
    - strength
sets: 2
reps: 6
rep_seconds: 6
rep_rest_seconds: 3
set_rest_seconds: 30
prep_seconds: 5
media:
    - url: https://www.youtube.com/watch?v=_IZ-te1nkdk
      thumb_url: https://i.ytimg.com/vi/_IZ-te1nkdk/maxresdefault.jpg
notes: |-
    2, 3, 1 Pacing. Holding a weight in your hands (if you need one), lower yourself into the lowest position of your squat over the course of 2 seconds. Hold the bottom position for 3 seconds, actively trying to open your hips as wide as possible. Then, extend your legs back up into your highest position over the course of 1 second. Repeat for the prescribed amount of repetitions.
