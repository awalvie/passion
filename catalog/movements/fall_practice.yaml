name: Fall Practice
style: open
tags:
    - mental
    - route
    - tactics
source: Neil Gresham
notes: |-
    With a belayer. First thing, while fresh.

    Ladder: clip at waist, then knees, then feet, then one move above, then two.
    Let go — don't jump. Hands off the rope. Say when you're going.

    Move up a rung when the current one is boring.
