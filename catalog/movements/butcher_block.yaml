id: f1443f51-a729-422e-96f2-60c038a63721
name: Butcher Block
style: open
tags:
    - cooldown
    - mobility
    - shoulder
notes: |-
    One hold of 60s.

    Forearms on a bench or table, elbows shoulder-width. Walk the hips back.

    Ribs down and tailbone tucked first, then let the chest drop. You should
    feel it in the armpits, not the low back.
