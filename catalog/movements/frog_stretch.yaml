name: Frog Stretch
style: open
tags:
    - cooldown
    - mobility
notes: |-
    Two holds of 60s, 30s between.

    Knees wide, shins in line with the knees, forearms on the floor.

    Rock back only to the point before the low back rounds. Back off if the
    inside of the knee complains.
