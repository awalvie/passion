name: One-Handed Climbing
style: climbing
tags:
    - balance
    - boulder
    - dynamic
    - technique
notes: |-
    Climb easy boulders with one hand. Keep the other off the wall.

    Slab: find the spot where you can let go without falling. Hips close, move slowly.
    Steep: drive from your legs, and let go only once your hips reach the wall.

    Do each problem once with each hand.
source: Lattice Training
