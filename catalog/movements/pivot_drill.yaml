id: 6b19924f-6cdf-43e1-bd9a-8d067c3a1242
name: Pivot Drill
style: open
tags:
    - footwork
    - technique
    - warmup
notes: |-
    Two good jugs, two footholds. Big toes on the holds, not the ball of the foot.
    Spin your hips from side to side on your toes without moving your feet. Arms relaxed, sit low.

    Then traverse on big holds and pivot into every move. Feet under the hands, not wide.
    Go to smaller footholds, then smears.
source: ROAP Coaching
