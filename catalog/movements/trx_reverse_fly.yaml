id: 63178639-c51e-4277-8998-64fa69d33da2
name: TRX Reverse Fly
style: reps_and_sets
tags:
    - antagonist
    - shoulder
notes: |-
    Face the anchor and lean back, a soft bend in the elbows, ribs down.

    Pull the arms out wide and squeeze the shoulder blades, no shrug. Walk the feet forward to
    make it harder, but not so far that it turns into a row.
