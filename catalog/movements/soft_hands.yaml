id: e59eecaa-84e9-4fdf-8531-8e2494bfdba6
name: Soft Hands
style: climbing
tags:
    - balance
    - fingers
    - technique
notes: |-
    Hands soft, weight on your feet. Go dynamically. Catch. Go soft again
    immediately.

    The hands should only work for the instant of the move. If they never
    relaxed, you hauled instead of pushing.

    Easy terrain, well below limit.
