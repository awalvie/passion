items:
    - menu:
        name: Wall Crawls
        notes: |-
            Optional. Pick one. Once or twice a week, warm but before the real session.

            Teaches your fingers to apply strength on the wall rather than on a
            hangboard. Quality over quantity — move slow, rest 5 min, never feel
            desperate. The point is to own the holds.

            Fine to keep the same crawls for months.
