# The whole tag vocabulary. 21 entries.
#
# The importer validates every `tags:` entry against this file and fails on anything not
# listed, so a typo cannot mint `shouldres`. Adding a tag is editing this file.
#
# There is one of these, in the shipped tree. A private tree needs none: after the merges
# recorded below, every tag either tree uses is in this list. The only tag once unique to a
# private tree was `lead`, now `route`.
#
# Grouped by what the tag is about. The groups are for a reader, not enforced — a tag is
# just a slug. Six axes are mixed in one flat list, which is a known limit: "show me finger
# exercises I can do on a hangboard" is not a query against one list. Recorded in
# docs/CATALOG_FORMAT.md rather than fixed in V2.

