# ---------------------------------------------------------------------------
# What was removed, and what the conversion rewrites. 29 tags became 21.
#
# Decided 2026-09-08. Every one of the eight was used once or twice, and enforcing the list
# would have frozen them as permanent vocabulary.
#
#   MERGED -- the same idea under two names:
#     shoulders   -> shoulder     butcher_block
#     stretching  -> mobility     mobility_day (already had mobility, so nothing was lost)
#     lead        -> route        movement_practice_lead
#     prehab      -> antagonist   face_pulls (already had antagonist), copenhagen_adduction
#
#   DROPPED -- movement patterns, one file each, and three members is not an axis. All
#   three files keep `strength`, and nothing in the app browses by pattern:
#     squat       front_squat
#     hinge       deadlift
#     pressing    push_up_variation
#
#   DROPPED -- rest:
#     rest        mobility_day. It was the only tag marking a rest day, so the meaning is
#                 gone rather than moved. Deliberate.
#
#   KEPT -- mental:
#     fall_practice, which also carries `route, tactics`. Falling practice is a mental
#     thing rather than a tactical one, so the tag says something the others do not.
