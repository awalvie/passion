{{ define "layouts/base" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>

    <script src="/static/htmx.min.js"></script>
    <script src="/static/tailwind.min.js"></script>
    <script src="/static/lucide.min.js"></script>
    <script src="/static/drag-drop-touch.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      (function () {
        var t = localStorage.getItem("passion-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="/static/passion.css">
    <link rel="stylesheet" href="/static/vendor/toastui-editor.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
      /* Fit the editor chrome to the app's card style */
      .md-editor-wrap .toastui-editor-defaultUI { border: none; border-radius: 0; }
      .md-editor-wrap .toastui-editor-toolbar { border-bottom: 1px solid var(--border); background: var(--card-muted); }
      .md-editor-wrap .toastui-editor-main { background: var(--panel); }
      .md-editor-wrap .toastui-editor-ww-container { background: var(--panel); }
      .md-editor-wrap .ProseMirror { color: var(--text); font-size: 0.875rem; min-height: 100px; padding: 0.625rem 0.75rem; }
      .md-editor-wrap .toastui-editor-toolbar-icons { color: var(--muted); }
      .md-editor-wrap .toastui-editor-toolbar-icons:hover,
      .md-editor-wrap .toastui-editor-toolbar-icons.active { background: var(--card-muted); color: var(--text); }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.__passionRenderIcons = () => {
          if (window.lucide && typeof window.lucide.createIcons === "function") {
            window.lucide.createIcons();
          }
        };
        window.__passionSyncExerciseKindGroups = function (kindSelect) {
          if (!kindSelect || !kindSelect.form) return;
          const form = kindSelect.form;
          const kind = kindSelect.value;
          const session = kind === "session";
          const isCatalog = kind === "exercise_catalog";
          const isTimed = kind === "timed_reps";
          const isClimbing = kind === "climbing";
          const isReps = !session && !isCatalog && !isTimed && !isClimbing;
          const reps = form.querySelector("[data-exercise-reps-fields]");
          const timed = form.querySelector("[data-exercise-timed-fields]");
          const sess = form.querySelector("[data-exercise-session-fields]");
          const media = form.querySelector("[data-exercise-media-fields]");
          if (reps) {
            reps.hidden = !isReps;
            reps.querySelectorAll("input, textarea, select").forEach(function (el) {
              if (el === kindSelect) return;
              el.disabled = !isReps;
            });
          }
          if (timed) {
            timed.hidden = !isTimed;
            timed.querySelectorAll("input, textarea, select").forEach(function (el) {
              if (el === kindSelect) return;
              el.disabled = !isTimed;
            });
          }
          if (sess) {
            sess.hidden = !session || isCatalog || isClimbing;
            sess.querySelectorAll("input, textarea, select").forEach(function (el) {
              el.disabled = !session || isCatalog || isClimbing;
            });
          }
          if (media) {
            media.hidden = isCatalog || isClimbing;
            media.querySelectorAll("input, textarea, select").forEach(function (el) {
              el.disabled = isCatalog || isClimbing;
            });
          }
          var addHint = form.querySelector("[data-catalog-add-hint]");
          if (addHint) {
            addHint.hidden = !isCatalog;
          }
          var libHint = form.querySelector("[data-catalog-library-hint]");
          if (libHint) {
            libHint.hidden = !isCatalog;
          }
          var optPanel = form.querySelector("[data-catalog-options-panel]");
          if (optPanel) {
            optPanel.hidden = !isCatalog;
            optPanel.querySelectorAll('input[name="option_name"]').forEach(function (el) {
              el.disabled = !isCatalog;
            });
            optPanel.querySelectorAll("[data-add-catalog-option-row], [data-remove-option-row]").forEach(function (el) {
              el.disabled = !isCatalog;
            });
            optPanel.querySelectorAll("[data-catalog-lib-search], [data-catalog-lib-select], [data-catalog-add-from-library]").forEach(function (el) {
              el.disabled = !isCatalog;
            });
          }
          var kindHint = kindSelect.parentElement && kindSelect.parentElement.querySelector("[data-kind-hint]");
          if (kindHint) {
            var kindHints = {
              "reps_and_sets":    "Track sets, reps, and optional weight. Progress through each set manually.",
              "timed_reps":       "Each rep runs a countdown timer — great for holds, stretches, or timed intervals.",
              "session":          "A stopwatch or countdown for an open activity block. No set/rep tracking.",
              "climbing":         "Log individual climbs with grades and styles. Supports an optional time limit.",
              "exercise_catalog": "A menu — during the run, choose which exercise to perform from a list of options.",
            };
            kindHint.textContent = kindHints[kind] || "";
          }
          window.__passionRenderIcons();
        };
        window.__passionRenderIcons();

        // Media row add/remove for repeatable media inputs
        window.__passionBindMediaRows = function (root) {
          var scope = root || document;
          scope.querySelectorAll("[data-media-add]").forEach(function (btn) {
            if (btn.dataset.mediaBound === "1") return;
            btn.dataset.mediaBound = "1";
            btn.addEventListener("click", function () {
              var list = btn.parentElement.querySelector("[data-media-list]");
              if (!list) return;
              var row = list.querySelector("[data-media-row]");
              if (!row) return;
              var clone = row.cloneNode(true);
              clone.querySelectorAll("input").forEach(function (inp) { inp.value = ""; });
              list.appendChild(clone);
              window.__passionBindMediaRows(clone);
            });
          });
          scope.querySelectorAll("[data-media-remove]").forEach(function (btn) {
            if (btn.dataset.mediaBound === "1") return;
            btn.dataset.mediaBound = "1";
            btn.addEventListener("click", function () {
              var row = btn.closest("[data-media-row]");
              if (!row) return;
              var list = row.parentElement;
              if (list && list.querySelectorAll("[data-media-row]").length > 1) {
                row.remove();
              } else {
                row.querySelectorAll("input").forEach(function (inp) { inp.value = ""; });
              }
            });
          });
        };
        window.__passionBindMediaRows();

        window.__passionBindNotesEditors = function (root) {
          const scope = root || document;
          scope.querySelectorAll("[data-notes-editor]").forEach(function (wrap) {
            if (wrap.dataset.notesBound === "1") return;
            wrap.dataset.notesBound = "1";
            const ta = wrap.querySelector('textarea[name="notes"]');
            const preview = wrap.querySelector("[data-notes-preview]");
            const btnWrite = wrap.querySelector('[data-notes-tab="write"]');
            const btnPreview = wrap.querySelector('[data-notes-tab="preview"]');
            if (!ta || !preview || !btnWrite || !btnPreview) return;

            function showWrite() {
              ta.classList.remove("hidden");
              preview.classList.add("hidden");
              btnWrite.classList.add("notes-tab-active");
              btnPreview.classList.remove("notes-tab-active");
            }

            function showPreview() {
              ta.classList.add("hidden");
              preview.classList.remove("hidden");
              btnWrite.classList.remove("notes-tab-active");
              btnPreview.classList.add("notes-tab-active");
              preview.innerHTML = '<p class="text-xs muted m-0">Loading…</p>';
              const body = new URLSearchParams();
              body.set("content", ta.value);
              fetch("/preview/markdown", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: body.toString(),
              })
                .then(function (r) {
                  return r.text();
                })
                .then(function (html) {
                  preview.innerHTML = html;
                })
                .catch(function () {
                  preview.innerHTML = '<p class="text-xs muted m-0">Preview failed.</p>';
                });
            }

            btnWrite.addEventListener("click", showWrite);
            btnPreview.addEventListener("click", showPreview);
          });
        };

        document.body.addEventListener("htmx:afterSwap", () => {
          window.__passionRenderIcons();
          if (typeof window.__passionSyncExerciseKindGroups === "function") {
            document.querySelectorAll('select[name="kind"]').forEach(function (sel) {
              window.__passionSyncExerciseKindGroups(sel);
            });
          }
          if (typeof window.__passionBindNotesEditors === "function") {
            window.__passionBindNotesEditors(document);
          }
          if (typeof window.__passionBindMediaRows === "function") {
            window.__passionBindMediaRows(document);
          }
        });

        const toggle = document.getElementById("theme-toggle");
        if (toggle) {
          toggle.checked = document.documentElement.getAttribute("data-theme") === "dark";
          toggle.addEventListener("change", () => {
            const next = toggle.checked ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("passion-theme", next);
          });
        }

        if (typeof window.__passionBindNotesEditors === "function") {
          window.__passionBindNotesEditors(document);
        }
        if (typeof window.__passionBindMediaRows === "function") {
          window.__passionBindMediaRows(document);
        }
        if (typeof window.__passionSyncExerciseKindGroups === "function") {
          document.querySelectorAll('select[name="kind"]').forEach(function (sel) {
            window.__passionSyncExerciseKindGroups(sel);
          });
        }
      });
    </script>
  </head>

  <body class="min-h-screen">
    <div class="{{ if .WideLayout }}passion-container passion-container-wide{{ else }}passion-container{{ end }}">
      {{ template "layouts/fragments/topbar" . }}

      <main class="mt-4 md:mt-6">
        {{ template "content" . }}
      </main>

      {{ template "layouts/fragments/footer" . }}
    </div>
    <div id="start-session-modal-host"></div>
    <datalist id="catalog-source-options">
      <option value="Power Company Climbing"></option>
      <option value="Paradigm Climbing"></option>
      <option value="Logical Progression"></option>
      <option value="Lattice Training"></option>
      <option value="Tension Climbing"></option>
      <option value="Emil Abrahamsson"></option>
      <option value="Self-Coached Climber"></option>
      <option value="Crimpd"></option>
    </datalist>
    <script src="/static/vendor/toastui-editor-all.min.js"></script>
    <script src="/static/markdown-editor.js"></script>
  </body>
</html>
{{ end }}
