{{ define "content" }}
<section class="card card-pad max-w-md mx-auto">
  <h1 class="text-xl font-bold">Log in</h1>
  <p class="text-sm muted mt-1">Sign in to access your workouts.</p>

  {{ if .AuthFormError }}
    <div class="mt-3 rounded-md border px-3 py-2 text-sm" style="border-color: var(--destructive); color: var(--destructive)">
      {{ .AuthFormError }}
    </div>
  {{ end }}

  <form class="mt-4 space-y-3" method="post" action="/login">
    <div>
      <label for="email" class="text-xs muted">Email</label>
      <input id="email" name="email" type="email" class="mt-1 w-full input" required />
    </div>
    <div>
      <label for="password" class="text-xs muted">Password</label>
      <input id="password" name="password" type="password" class="mt-1 w-full input" required />
    </div>
    <button type="submit" class="btn btn-accent">Log in</button>
  </form>

  <p class="text-sm muted mt-4">No account yet? <a href="/signup" class="underline">Sign up</a>.</p>
</section>
{{ end }}
