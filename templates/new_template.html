{{ define "content" }}
<div class="max-w-xl">
  <div class="card card-pad">
    <h1 class="text-xl font-bold">Create a session template</h1>
    <p class="mt-1 text-sm muted">Templates contain activities; activities contain exercises. You can schedule templates later.</p>

    <form class="mt-6 space-y-3" hx-post="/templates/new" hx-swap="none" method="post">
      <div>
        <label class="text-sm font-medium" for="name">Template name</label>
        <input
          id="name"
          name="name"
          required
          class="mt-1 w-full input"
          placeholder="e.g., Full Body (A)"
        />
      </div>

      <div class="flex items-center gap-2">
        <button class="rounded-md btn-primary px-4 py-2 text-sm font-medium" type="submit">
          Create
        </button>
        <a class="rounded-md btn-ghost px-4 py-2 text-sm" href="/templates">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{{ end }}
