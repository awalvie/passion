{{ define "fragments/start-session-picker" }}
<dialog id="start-session-picker-dialog" class="catalog-dialog">
  <div class="catalog-dialog-panel">
    <div class="catalog-dialog-body">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="m-0 text-base font-semibold">Start session</h3>
        </div>
        <form method="dialog">
          <button type="submit" class="rounded-md btn-ghost px-3 py-1 text-sm font-medium">Close</button>
        </form>
      </div>

      {{ if .Templates }}
        <form
          hx-post="/dashboard/start-template"
          hx-swap="none"
          method="post"
          class="mt-4 flex flex-col gap-3"
        >
          <div>
            <label for="start-session-template-id" class="mb-1 block text-xs font-medium muted">From template</label>
            <select
              id="start-session-template-id"
              name="template_id"
              class="w-full rounded-md border-input bg-background px-3 py-2 text-sm ring-offset-background focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
              aria-label="Choose template to start"
              required
            >
              <option value="" disabled selected>Choose a template...</option>
              {{ range .Templates }}
                <option value="{{ .ID }}">{{ .Name }}</option>
              {{ end }}
            </select>
          </div>
          <button type="submit" class="rounded-md btn-primary px-4 py-2 text-sm font-medium">
            Start now
          </button>
        </form>

        <div class="my-4 flex items-center gap-3">
          <div class="flex-1 border-t" style="border-color:var(--border)"></div>
          <span class="text-xs muted">or</span>
          <div class="flex-1 border-t" style="border-color:var(--border)"></div>
        </div>
      {{ else }}
        <p class="mt-4 mb-4 text-sm muted">
          No templates yet.
          <a href="/templates/new" class="underline">Create one first.</a>
        </p>
      {{ end }}

      <form hx-post="/runs/open" hx-swap="none" method="post" class="flex flex-col gap-3">
        <div>
          <label class="mb-1 block text-xs font-medium muted" for="open-session-name">Open session name <span class="font-normal">(optional)</span></label>
          <input
            id="open-session-name"
            name="name"
            type="text"
            class="w-full input"
            placeholder="e.g., Morning mobility, Push day…"
            autocomplete="off"
          />
        </div>
        <button type="submit" class="rounded-md btn-ghost border px-4 py-2 text-sm font-medium" style="border-color:var(--border)">
          Start open session
        </button>
      </form>
    </div>
  </div>
</dialog>
{{ end }}
