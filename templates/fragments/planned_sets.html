{{ define "fragments/planned_sets" }}
<div id="planned-sets-{{ .ExerciseID }}" hx-target="this" class="space-y-2">
  {{ if .PlannedSets }}
    {{ range .PlannedSets }}
    <div class="flex items-center gap-2">
      <span class="text-xs muted w-10 shrink-0">Set {{ .SetIndex }}</span>
      <form
        hx-post="{{ $.RoutePrefix }}/planned-sets/{{ .SetIndex }}/save"
        hx-swap="none"
        hx-trigger="change delay:600ms"
        class="flex-1 grid grid-cols-2 gap-2"
      >
        <div>
          <label class="sr-only text-xs font-medium" for="ps-reps-{{ $.ExerciseID }}-{{ .SetIndex }}">Reps</label>
          <input id="ps-reps-{{ $.ExerciseID }}-{{ .SetIndex }}" name="reps" type="number" min="0"
            value="{{ if .Reps }}{{ .Reps }}{{ end }}" placeholder="Reps" class="w-full input text-sm" />
        </div>
        <div>
          <label class="sr-only text-xs font-medium" for="ps-kg-{{ $.ExerciseID }}-{{ .SetIndex }}">kg</label>
          <input id="ps-kg-{{ $.ExerciseID }}-{{ .SetIndex }}" name="weight_kg" type="number" min="0" step="0.5"
            value="{{ if .WeightKg }}{{ .WeightKg }}{{ end }}" placeholder="kg" class="w-full input text-sm" />
        </div>
      </form>
      <button
        type="button"
        class="shrink-0 rounded-md btn-ghost p-1.5 min-w-[1.75rem] min-h-[1.75rem] inline-flex items-center justify-center"
        hx-post="{{ $.RoutePrefix }}/planned-sets/{{ .SetIndex }}/delete"
        hx-target="#planned-sets-{{ $.ExerciseID }}"
        hx-swap="outerHTML"
        title="Remove set"
      ><i data-lucide="x" style="width:0.75rem;height:0.75rem" aria-hidden="true"></i></button>
    </div>
    {{ end }}
  {{ end }}
  <div class="flex items-center gap-2 mt-1">
    <button
      type="button"
      class="rounded-md btn-ghost px-3 py-1.5 text-xs font-medium"
      hx-post="{{ .RoutePrefix }}/planned-sets"
      hx-target="#planned-sets-{{ .ExerciseID }}"
      hx-swap="outerHTML"
    >+ Add set</button>
    {{ if .PlannedSets }}
    <button
      type="button"
      class="rounded-md btn-ghost px-3 py-1.5 text-xs muted"
      hx-post="{{ .RoutePrefix }}/planned-sets/clear"
      hx-target="#planned-sets-{{ .ExerciseID }}"
      hx-swap="outerHTML"
    >Remove plan</button>
    {{ end }}
  </div>
</div>
{{ end }}
